    +(bodyRows.length>1?'<div class="sec"><div class="sec-title">משקל גוף<span class="hint">מהמעקב היומי</span></div><div class="card">'
      +lineChart(bodyRows,{color:'var(--blue)',fmt:v=>v.toFixed(1)})
      +'<div class="log-note">המשקל קופץ מיום ליום בגלל מים ואוכל — מסתכלים על הקו לאורך שבועות, לא על מדידה בודדת.</div></div></div>':'')
    +'<div class="sec"><div class="sec-title">אימונים אחרונים</div><div class="card">'+historyList()+'</div></div>'
    +logSections()+'</div>';
}
function historyList(){
  const rows=Object.values(state.data.sessions).filter(s=>setsDone(s)>0).sort((a,b)=>a.date<b.date?1:-1).slice(0,15);
  if(!rows.length) return '<div class="hist-empty">עוד לא נשמרו אימונים.<br>סמן סט אחד וזה יופיע כאן.</div>';
  return '<div class="hist-list">'+rows.map(s=>{
    const p=progOf(s.day), v=Math.round(volumeOf(s));
    return '<div class="hist-row"><span class="hist-date">'+s.date.slice(5).replace('-','/')+'</span>'
      +'<div class="hist-mid"><div class="hist-name">'+esc(p.label)+'</div>'
      +'<div class="hist-note">'+(s.note?esc(s.note):(v?num(v)+' ק״ג נפח':''))+'</div></div>'
      +'<span class="hist-pct" style="color:'+p.hex+'">'+sessionPct(s)+'%</span></div>';
  }).join('')+'</div>';
}

/* ===== daily log: steps, weight, tips and backup (lives inside התקדמות) ===== */
function logSections(){
  const now=new Date();
  const isCur=state.calY===now.getFullYear()&&state.calM===now.getMonth();
  const daysIn=new Date(state.calY,state.calM+1,0).getDate();
  const lastDay=isCur?now.getDate():daysIn, today=todayISO();
  let steps=0, logged=0, rows=[];
  for(let d=1;d<=lastDay;d++){
    const ds=state.calY+'-'+pad2(state.calM+1)+'-'+pad2(d);
    const e=state.data.daily[ds]||{};
    if(e.steps!=null){ steps+=e.steps; logged++; }
    rows.push('<tr class="'+(ds===today?'today-row':'')+'"><td class="day-cell">'+d+' ('+WEEKDAY_HE[new Date(state.calY,state.calM,d).getDay()]+')</td>'
      +'<td><input type="number" min="0" step="100" inputmode="numeric" data-k="daily-'+ds+'-steps" value="'+(e.steps==null?'':e.steps)+'" placeholder="—"></td>'
      +'<td><input type="number" min="0" step="0.1" inputmode="decimal" data-k="daily-'+ds+'-weight" value="'+(e.weight==null?'':e.weight)+'" placeholder="—"></td></tr>');
  }
  const custom = Object.keys(prefs().plan).length, hidden = Object.keys(prefs().hidden).length;
  const added = Object.values(prefs().added).reduce((a,x)=>a+(x||[]).length,0);

  return '<div class="sec"><div class="sec-title">מעקב יומי<span class="hint">צעדים ומשקל גוף</span></div><div class="card">'
    +'<div class="kpis"><div class="kpi"><div class="n">'+num(steps)+'</div><div class="l">צעדים החודש</div></div>'
    +'<div class="kpi"><div class="n">'+num(logged?Math.round(steps/logged):0)+'</div><div class="l">ממוצע ליום</div></div>'
    +'<div class="kpi"><div class="n">'+logged+'</div><div class="l">ימים שנרשמו</div></div></div>'
    +'<div class="log-sub">'+MONTH_HE[state.calM]+' '+state.calY+' · החודש נבחר בלוח שלמעלה</div>'
    +'<div class="log-table-wrap"><table class="log-table"><thead><tr><th>יום</th><th>צעדים</th><th>משקל (ק״ג)</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'
    +'<div class="log-note">'+esc(CFG.logNote)+'</div></div></div>'
    +'<details class="panel"><summary>איך מתקדמים נכון</summary><div class="panel-body">'
    +CFG.tips.map(t=>'<p><b>'+esc(t[0])+':</b> '+esc(t[1])+'</p>').join('')+'</div></details>'
    +'<details class="panel"><summary>ההתאמות שלי לתוכנית</summary><div class="panel-body">'
    +'<p><b>'+added+'</b> תרגילים שהוספת · <b>'+hidden+'</b> תרגילים שהורדת · <b>'+custom+'</b> תרגילים עם סטים/חזרות מותאמים.</p>'
    +'<p>ההתאמות נשמרות לפרופיל שלך ומסתנכרנות לענן, כך שהן נשארות גם אם תפתח את האפליקציה בטלפון אחר.</p>'
    +'<div class="btn-row"><button class="btn danger" data-act="resetprefs">אפס את כל ההתאמות</button></div></div></details>'
    +'<details class="panel"><summary>גיבוי, שחזור ומשתמש</summary><div class="panel-body">'
    +'<p>הנתונים נשמרים במכשיר, ואם Supabase מחובר — גם בענן, כך שאותו פרופיל נפתח בכל מכשיר.</p>'
    +'<textarea class="backup-area" id="backup" spellcheck="false">'+esc(JSON.stringify(state.data))+'</textarea>'
    +'<div class="btn-row"><button class="btn primary" data-act="copy">העתק גיבוי</button>'
    +'<button class="btn" data-act="restore">שחזר מהטקסט</button>'
    +'<button class="btn" data-act="haptics">'+(hapticsOn()?'רטט: פועל':'רטט: כבוי')+'</button>'
    +'<button class="btn" data-act="switch">החלף משתמש</button>'
    +'<button class="btn danger" data-act="reset">מחק הכל</button></div></div></details>';
}

const BOOT_HTML = '<div class="boot"><svg class="lifter" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="טוען"><defs><linearGradient id="lfRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5EE7FF"/><stop offset="50%" stop-color="#3DA9FC"/><stop offset="100%" stop-color="#FF4D6D"/></linearGradient><linearGradient id="lfBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5EE7FF"/><stop offset="100%" stop-color="#2FE6A7"/></linearGradient></defs><circle class="lf-ring" cx="100" cy="105" r="86"/><g class="lf-body"><circle cx="100" cy="40" r="13"/><path d="M76 60 Q100 53 124 60 L117 120 Q100 126 83 120 Z"/><path class="lf-limb" d="M89 122 L84 190"/><path class="lf-limb" d="M111 122 L116 190"/></g><path class="lf-arm" d="M78 65 L58 110"/><path class="lf-arm" d="M122 65 L142 110"/><g class="lf-fore lf-foreL"><path class="lf-arm" d="M58 110 L58 148"/><g transform="translate(58 150)" class="lf-bell"><rect x="-15" y="-3.5" width="30" height="7" rx="3.5"/><rect x="-21" y="-9" width="8" height="18" rx="3"/><rect x="13" y="-9" width="8" height="18" rx="3"/></g></g><g class="lf-fore lf-foreR"><path class="lf-arm" d="M142 110 L142 148"/><g transform="translate(142 150)" class="lf-bell"><rect x="-15" y="-3.5" width="30" height="7" rx="3.5"/><rect x="-21" y="-9" width="8" height="18" rx="3"/><rect x="13" y="-9" width="8" height="18" rx="3"/></g></g></svg><div class="boot-txt">טוען<i></i><i></i><i></i></div></div>';

/* ================= render ================= */
function render(){
  if(state.loading){ app.innerHTML='<div class="wrap">' + BOOT_HTML + '</div>'; return; }
  const sy=window.scrollY;
  const ae=document.activeElement, fk=(ae&&ae.dataset)?ae.dataset.k:null;
  let html='';
  if(state.screen==='pick') html=screenPick();
  else if(state.screen==='home') html=screenHome();
  else if(state.screen==='workout') html=screenWorkout();
  else if(state.screen==='cardio') html=screenCardio();
  else if(state.screen==='progress') html=screenProgress();
  else html=screenProgress();
  if(state.modal){
    if(state.modal.type==='pool' && state.screen==='workout') html += poolModal();
    else if(state.modal.type==='plan' && state.screen==='workout') html += planModal();
    else if(state.modal.type==='body') html += bodyModal();
  }
  app.innerHTML=html;
  document.body.classList.toggle('home-lock', state.screen==='home' && !state.modal);
  if(state.screen==='home') window.scrollTo(0,0);
  if(fk){ const el=app.querySelector('[data-k="'+fk+'"]'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} } }
  if(state.screen==='home') countUp();
  if(state.screen!=='home') window.scrollTo(0,sy);
}

/* ================= events ================= */
/* 'ck' is missing on purpose — toggleSet picks its own pattern, and 'haptics'
   fires after the setting flips so switching it on is something you can feel. */
const HAPTIC_FOR = {
  pick:'nav', back:'nav', home:'nav', open:'nav', closemodal:'nav', switch:'nav',
  kill:'warn', reset:'warn', resetprefs:'warn',
  coach:'tick', addex:'tick', hold:'tick', restore:'tick', savecardio:'done'
};
app.addEventListener('click', e=>{
  if(e.target.classList && e.target.classList.contains('modal')){ goBack(); return; }
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v, k=t.dataset.k;
  if(a!=='ck' && a!=='haptics') haptic(HAPTIC_FOR[a] || 'tap');
  if(a==='pick'){ enter(v); }
  else if(a==='theme'){ toggleTheme(); render(); }
  else if(a==='back'||a==='home'){ goBack(); }
  else if(a==='body'){ openModal({type:'body', ex:k}); }
  else if(a==='pool'){ openModal({type:'pool'}); }
  else if(a==='plan'){ openModal({type:'plan', ex:k}); }
  else if(a==='closemodal'){ goBack(); }
  else if(a==='open'){
    if(v==='__progress'){ const n=new Date(); go('progress',{calY:n.getFullYear(),calM:n.getMonth(),calSel:null,chartEx:0}); }
    else{ const p=progOf(v); go(p.type==='cardio'?'cardio':'workout',{day:v}); }
  }
  else if(a==='ck') toggleSet(k, +t.dataset.set);
  else if(a==='ww') bumpWeight(k, +t.dataset.d);
  else if(a==='coach') applyWeight(k, +t.dataset.w);
  else if(a==='kill'){ if(state.modal) closeModal(); removeExercise(k); }
  else if(a==='addex') addExercise(k);
  else if(a==='haptics'){
    const on = !hapticsOn();
    LS('icon4me_haptics', on ? '1' : '0');
    render();
    if(on) haptic('tick');
    toast(on ? 'רטט הופעל' : 'רטט כובה');
  }
  else if(a==='plan+') changePlan(k, t.dataset.f, 1);
  else if(a==='plan-') changePlan(k, t.dataset.f, -1);
  else if(a==='planreset') resetPlan(k);
  else if(a==='kind'){ state.kind=v; render(); }
  else if(a==='sw') stopWatch(v);
  else if(a==='savecardio') saveCardio();
  else if(a==='hold') startRest(+t.dataset.sec, 'זמן התרגיל', t.dataset.nm||'');
  else if(a==='calday'){ state.calSel = (state.calSel===v?null:v); render(); }
  else if(a==='mon'){
    let m=state.calM+(+v), y=state.calY;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    const n=new Date(); if(y>n.getFullYear()||(y===n.getFullYear()&&m>n.getMonth())) return;
    state.calM=m; state.calY=y; state.calSel=null; render();
  }
  else if(a==='copy'){
    const ta=document.getElementById('backup'); ta.select();
    try{ document.execCommand('copy'); toast('הגיבוי הועתק'); }catch(err){ toast('בחר והעתק ידנית'); }
  }
  else if(a==='restore'){
    try{
      const d=JSON.parse(document.getElementById('backup').value);
      if(!d||typeof d!=='object'||!d.sessions) throw 0;
      state.data=normalize(d); saveLocal(); enqueue(pushAll); render(); toast('שוחזר ✓');
    }catch(err){ toast('הטקסט לא תקין — הדבק את הגיבוי המלא'); }
  }
  else if(a==='resetprefs'){
    if(!confirm('לאפס את כל ההתאמות? התרגילים יחזרו לתוכנית המקורית. ההיסטוריה לא תימחק.')) return;
    state.data.prefs = emptyPrefs(); persistPrefs(); render(); toast('אופס ✓');
  }
  else if(a==='reset'){
    if(!confirm('למחוק את כל ההיסטוריה של '+CFG.name+'? אי אפשר לשחזר בלי גיבוי.')) return;
    state.data=normalize(null); saveLocal(); render(); toast('נמחק');
  }
  else if(a==='switch'){
    LS('icon4me_profile', null);
    PROFILE=null; state.calSel=null; state.modal=null; go('pick',null,true);
  }
});
app.addEventListener('change', e=>{
  if(e.target.dataset.act==='chartex'){ state.chartEx=+e.target.value; render(); }
});
app.addEventListener('input', e=>{
  const k=e.target.dataset.k; if(!k) return;
  const v=e.target.value;
  if(k==='note'){ getSession(state.day,true).note=v; persist(); enqueue(()=>pushSession(getSession(state.day,true))); return; }
  if(k.indexOf('daily-')===0){ const p=k.split('-'); updateDaily(p[1]+'-'+p[2]+'-'+p[3],p[4],v); return; }
  if(k.indexOf('ww-')===0){
    const key=k.slice(3), val = v===''?null:Number(v);
    setWorkingWeight(key,val);
    const s=getSession(state.day,true);
    (s.sets[key]||[]).forEach(c=>{ if(!c.d) c.w = val; });
    enqueue(()=>pushSession(s));
  }
});
app.addEventListener('toggle', e=>{
  const k=e.target.dataset&&e.target.dataset.okey;
  if(k) state.open[k]=e.target.open;
}, true);
document.getElementById('restBar').addEventListener('click', e=>{
  const b=e.target.closest('[data-rest]'); if(!b) return;
  haptic('tap');
  if(b.dataset.rest==='skip'){ stopRest(); return; }
  restLeft=Math.max(1,restLeft+(+b.dataset.rest)); restTotal=Math.max(restTotal,restLeft); paintRest();
});

/* ================= boot ================= */
function mergeRemote(remote){
  const local=state.data, out=normalize(remote), localOnly=[];
  Object.keys(local.sessions).forEach(k=>{ if(!out.sessions[k]){ out.sessions[k]=local.sessions[k]; localOnly.push(k); } });
  Object.keys(local.weights).forEach(k=>{ if(out.weights[k]==null) out.weights[k]=local.weights[k]; });
  Object.keys(local.daily).forEach(k=>{ if(!out.daily[k]) out.daily[k]=local.daily[k]; });
  Object.keys(local.cardio).forEach(k=>{
    if(!out.cardio[k]||!(out.cardio[k].log||[]).length) out.cardio[k]=local.cardio[k];
  });
  const remoteHasPrefs = remote && remote.prefs &&
    (Object.keys(remote.prefs.hidden||{}).length || Object.keys(remote.prefs.plan||{}).length ||
     Object.keys(remote.prefs.added||{}).length);
  if(!remoteHasPrefs) out.prefs = local.prefs;
  state.data=out; saveLocal();
  localOnly.forEach(k=>enqueue(()=>pushSession(out.sessions[k])));
  if(!remoteHasPrefs) enqueue(pushPrefs);
}
async function enter(id){
  PROFILE=id; CFG=CATALOG[id];
  document.documentElement.style.setProperty('--pc',CFG.accent);
  LS('icon4me_profile',id);
  state.data=normalize(loadLocal(id));
  saveLocal();                       /* store the migrated shape once */
  const cardioProg=CFG.programs.filter(p=>p.type==='cardio')[0];
  state.kind=cardioProg?cardioProg.kinds[0].id:null;
  state.day=suggestDay(); state.loading=false; state.modal=null;
  go('home',null,true);
  if(SB){
    try{ const r=await pullRemote(); mergeRemote(r); setSync('ok'); render(); }
    catch(e){ setSync('off'); }
  } else setSync('local');
  setTimeout(prefetchDemos, 1500);
}
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
/* The splash would otherwise flash by in a few milliseconds — everything it waits
   for is synchronous. Hold it to SPLASH_MS from page load, then fade into the app. */
const SPLASH_MS = 700;
function boot(){
  migrateKeys();
  const saved=LS('icon4me_profile');
  const start=function(){
    state.loading=false;
    if(saved && CATALOG[saved]) enter(saved);
    else { state.screen='pick'; try{history.replaceState(navSnap(),'');}catch(e){} render(); }
  };
  if(reduced()){ start(); return; }
  let shown=0;
  try{ shown=performance.now(); }catch(e){}
  setTimeout(function(){
    const b=app.querySelector('.boot');
    if(b){ b.classList.add('out'); setTimeout(start,220); }
    else start();
  }, Math.max(0, SPLASH_MS-shown));
}
boot();
})();
