<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Assistant:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F1D2B; --surface:#2A2838; --surface-2:#363450; --line:#494667;
    --text:#F5F3FF; --text-dim:#A9A6C4;
    --red:#FF4D6D; --blue:#3DA9FC; --yellow:#FFD23F; --green:#2FE6A7;
    --muscle:#D9D6EC; --pc:#5EE7FF;
    --font-display:'Heebo',sans-serif; --font-body:'Assistant',sans-serif; --font-mono:'JetBrains Mono',monospace;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
  body{
    background: radial-gradient(circle at 8% 0%, color-mix(in srgb, var(--pc) 12%, transparent) 0%, transparent 42%), var(--bg);
    color:var(--text); font-family:var(--font-body); min-height:100dvh;
    padding-bottom:calc(90px + var(--safe-bottom)); -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  :focus-visible{outline:2px solid var(--yellow); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
  .wrap{max-width:540px;margin:0 auto;padding:calc(14px + var(--safe-top)) 16px 8px;}

  /* ---------- profile picker ---------- */
  .pick{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px;max-width:460px;margin:0 auto;}
  .pick-mark{font-family:var(--font-display);font-weight:900;font-size:40px;letter-spacing:-1px;display:flex;align-items:center;gap:12px;}
  .pick-mark .badge{width:44px;height:44px;border-radius:13px;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .pick-q{font-size:16px;color:var(--text-dim);margin:6px 0 10px;}
  .pick-card{
    display:flex;align-items:center;gap:14px;width:100%;text-align:start;cursor:pointer;
    background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px 18px;color:var(--text);
    transition:border-color .15s,transform .1s;
  }
  .pick-card:active{transform:scale(.985);}
  .pick-card .av{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:24px;color:#1a1826;flex-shrink:0;}
  .pick-card .nm{font-family:var(--font-display);font-weight:800;font-size:22px;}
  .pick-card .sb{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .pick-card .go{margin-inline-start:auto;font-size:20px;color:var(--text-dim);}
  .pick-note{font-size:12px;color:var(--text-dim);line-height:1.6;text-align:center;margin-top:8px;}

  /* ---------- home ---------- */
  .hero{padding:4px 2px 0;}
  .hello{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:-.5px;line-height:1.2;}
  .hello span{color:var(--pc);}
  .hero-sub{color:var(--text-dim);font-size:13.5px;margin-top:5px;}
  .rainbow-bar{height:4px;border-radius:4px;margin-top:13px;background:linear-gradient(90deg,var(--red),var(--blue),var(--yellow),var(--green));}
  .hero-stats{display:flex;gap:9px;margin-top:14px;}
  .hstat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;}
  .hstat .n{font-family:var(--font-mono);font-weight:700;font-size:18px;color:var(--sc,var(--text));}
  .hstat .l{font-size:10.5px;color:var(--text-dim);margin-top:3px;}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px;}
  .tile{
    position:relative;border-radius:20px;padding:15px 14px 14px;cursor:pointer;text-align:start;color:var(--text);
    background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);
    display:flex;flex-direction:column;gap:3px;min-height:104px;transition:transform .1s,background .15s;
  }
  .tile:active{transform:scale(.98);}
  .tile .ic{font-size:24px;line-height:1;}
  .tile .t{font-family:var(--font-display);font-weight:800;font-size:16px;margin-top:6px;}
  .tile .s{font-size:11.5px;color:var(--text-dim);line-height:1.4;}
  .tile .flag{
    position:absolute;top:11px;inset-inline-end:11px;font-size:9.5px;font-weight:800;border-radius:7px;padding:2px 6px;
    background:var(--tc);color:#1a1826;
  }
  .tile.done .flag{background:var(--green);}
  .tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:13px;min-height:0;padding:14px;}
  .tile.wide .ic{font-size:22px;}
  .tile.wide .t{margin-top:0;}
  .switch-user{margin:20px auto 6px;display:block;background:none;border:none;color:var(--text-dim);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:8px;}

  /* ---------- top bar on inner screens ---------- */
  .topbar{display:flex;align-items:center;gap:11px;padding:2px 0 2px;}
  .back{
    width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .topbar h1{font-family:var(--font-display);font-weight:800;font-size:19px;margin:0;flex:1;min-width:0;}
  .topbar .sub{display:block;font-family:var(--font-body);font-weight:500;font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .topbar .pill{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 9px;white-space:nowrap;}

  .progress-bar{height:6px;border-radius:4px;background:var(--surface-2);margin-top:13px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;transition:width .25s;}
  .progress-label{color:var(--text-dim);font-size:12.5px;margin-top:6px;font-family:var(--font-mono);display:flex;justify-content:space-between;}

  /* ---------- exercise cards ---------- */
  .ex-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .ex-card{background:var(--surface);border-radius:16px;padding:13px;border:1px solid var(--line);}
  .ex-card.complete{border-color:color-mix(in srgb, var(--dc) 55%, var(--line));}
  .ex-top{display:flex;gap:11px;align-items:flex-start;}
  .pictogram{flex-shrink:0;width:52px;height:92px;border-radius:12px;position:relative;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;}
  .pictogram svg{width:100%;height:100%;display:block;}
  .muscle-base{fill:var(--muscle);opacity:.45;}
  .muscle-hl{fill:var(--red);animation:pulse-muscle 1.8s ease-in-out infinite;}
  @keyframes pulse-muscle{0%,100%{opacity:1;}50%{opacity:.55;}}
  .view-tag{position:absolute;top:3px;right:3px;font-family:var(--font-mono);font-size:8.5px;color:var(--text-dim);background:var(--bg);padding:1px 4px;border-radius:4px;}
  .equip-badge{position:absolute;bottom:2px;left:2px;width:19px;height:19px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .ex-head{flex:1;min-width:0;}
  .ex-name{font-weight:700;font-size:15px;line-height:1.3;}
  .ex-meta{font-family:var(--font-mono);color:var(--dc);font-weight:700;font-size:12.5px;margin-top:3px;}
  .ex-spark{margin-top:6px;direction:ltr;}
  .ex-spark svg{display:block;}

  /* working weight */
  .ww{display:flex;align-items:center;gap:8px;margin-top:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;}
  .ww .lbl{font-size:12px;color:var(--text-dim);}
  .ww .step{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;cursor:pointer;line-height:1;}
  .ww input{width:74px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--font-mono);font-weight:700;font-size:16px;padding:7px 4px;text-align:center;}
  .ww .unit{font-size:12px;color:var(--text-dim);margin-inline-start:-4px;}
  .ww .saved{margin-inline-start:auto;font-size:10.5px;color:var(--text-dim);text-align:end;line-height:1.35;}

  .coach{margin-top:9px;display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.4;border-radius:10px;padding:7px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);}
  .coach b{color:var(--text);}
  .coach.up{border-color:color-mix(in srgb, var(--green) 55%, var(--line));}
  .coach.up b{color:var(--green);}
  .coach .apply{margin-inline-start:auto;background:var(--green);color:#12241d;border:none;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}

  .sets{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .set-head,.set-row{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:7px;align-items:center;}
  .set-head span{font-size:10.5px;color:var(--text-dim);text-align:center;font-family:var(--font-mono);}
  .set-n{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);text-align:center;}
  .field input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:var(--font-mono);font-size:15px;padding:9px 4px;text-align:center;}
  .field input:disabled{color:var(--text-dim);opacity:.6;}
  .set-row.done .field input{border-color:color-mix(in srgb, var(--dc) 45%, var(--line));background:color-mix(in srgb, var(--dc) 9%, var(--surface-2));}
  .check{width:44px;height:40px;border-radius:11px;border:2px solid var(--dc);background:transparent;color:var(--dc);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s;}
  .check.on{background:var(--dc);color:#1a1826;}
  .note-row{margin-top:12px;}
  .note-row input{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--text);font-size:14px;padding:7px 2px;}

  details.cues{margin-top:9px;}
  details.cues summary{cursor:pointer;font-size:12.5px;color:var(--text-dim);list-style:none;display:flex;align-items:center;gap:5px;padding:3px 0;}
  details.cues summary::-webkit-details-marker{display:none;}
  details.cues summary::before{content:'▸';font-size:10px;transition:transform .15s;}
  details.cues[open] summary::before{transform:rotate(90deg);}
  details.cues ul{margin:6px 0 2px;padding-inline-start:18px;color:var(--text-dim);font-size:13px;line-height:1.6;}

  /* ---------- cardio ---------- */
  .cardio-toggle{display:flex;gap:8px;margin-top:14px;}
  .cardio-toggle button{flex:1;padding:11px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text-dim);font-weight:700;font-family:var(--font-display);cursor:pointer;font-size:14px;}
  .cardio-toggle button.active{border-color:var(--dc);background:var(--dc);color:#1a1826;}
  .stage-card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;}
  .stage-badge{display:inline-block;font-family:var(--font-mono);font-size:11.5px;color:var(--dc);border:1px solid var(--dc);border-radius:10px;padding:2px 8px;margin-bottom:8px;}
  .stage-desc{font-size:15px;line-height:1.6;}
  .stage-pace{margin-top:8px;font-size:13px;color:var(--text-dim);}
  .stage-pace b{color:var(--text);}
  .stage-track{display:flex;gap:4px;margin-top:10px;}
  .stage-track i{flex:1;height:5px;border-radius:3px;background:var(--surface-2);}
  .stage-track i.on{background:var(--dc);}
  .cardio-form{margin-top:13px;display:flex;flex-direction:column;gap:9px;}
  .cardio-field{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .cardio-field label{font-size:13.5px;color:var(--text-dim);}
  .cardio-field input{width:86px;background:transparent;border:none;color:var(--text);font-family:var(--font-mono);font-size:15px;text-align:end;}
  .cardio-field input:focus{outline:none;}
  .rpe{display:flex;gap:7px;}
  .rpe button{flex:1;padding:10px 4px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;}
  .rpe button.on{border-color:var(--dc);color:var(--text);}
  .rpe-label{font-size:12.5px;color:var(--text-dim);}
  .cardio-save{padding:13px;border-radius:12px;border:none;background:var(--dc);color:#1a1826;font-family:var(--font-display);font-weight:800;font-size:15px;cursor:pointer;}
  .cardio-last{margin-top:9px;font-size:12.5px;color:var(--text-dim);font-family:var(--font-mono);}
  .cardio-speed{color:var(--dc);font-weight:700;}

  /* ---------- month calendar ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px;}
  .cal-nav button{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;}
  .cal-nav button:disabled{opacity:.32;}
  .cal-title{font-family:var(--font-display);font-weight:800;font-size:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);padding-bottom:2px;}
  .cal-cell{
    aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);cursor:default;padding:2px;
  }
  .cal-cell.blank{border:none;background:transparent;}
  .cal-cell.has{cursor:pointer;color:var(--text);border-color:transparent;}
  .cal-cell.today{outline:2px solid var(--pc);outline-offset:-2px;}
  .cal-cell.sel{outline:2px solid var(--yellow);outline-offset:-2px;}
  .cal-dots{display:flex;gap:2px;}
  .cal-dots i{width:5px;height:5px;border-radius:50%;display:block;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;font-size:11.5px;color:var(--text-dim);}
  .cal-legend span{display:flex;align-items:center;gap:5px;}
  .cal-legend i{width:9px;height:9px;border-radius:50%;}
  .cal-detail{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.6;}
  .cal-detail .d{font-family:var(--font-mono);color:var(--text-dim);font-size:11.5px;margin-bottom:4px;}
  .cal-sum{display:flex;gap:9px;margin-top:11px;}

  /* ---------- shared bits ---------- */
  .sec{margin-top:20px;}
  .sec-title{font-family:var(--font-display);font-weight:800;font-size:15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .sec-title .hint{font-weight:500;font-size:11.5px;color:var(--text-dim);font-family:var(--font-body);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;}
  .heat{display:flex;gap:8px;align-items:center;justify-content:center;}
  .heat-fig{flex:1;max-width:150px;text-align:center;}
  .heat-fig svg{width:100%;height:auto;max-height:230px;}
  .heat-fig .cap{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px;}
  .heat-legend{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:10px;font-size:11px;color:var(--text-dim);}
  .heat-legend i{width:16px;height:8px;border-radius:2px;display:inline-block;}
  .heat-miss{margin-top:10px;font-size:12.5px;color:var(--text-dim);line-height:1.5;text-align:center;}
  .heat-miss b{color:var(--yellow);}
  .chart-wrap{direction:ltr;}
  .chart-wrap svg{width:100%;height:auto;display:block;}
  .chart-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:22px 6px;line-height:1.6;}
  .ex-picker{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13.5px;padding:10px;margin-bottom:10px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px;}
  .kpi{background:var(--surface-2);border-radius:11px;padding:9px 6px;text-align:center;}
  .kpi .n{font-family:var(--font-mono);font-weight:700;font-size:15.5px;}
  .kpi .l{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .stat{flex:1;background:var(--surface);border-radius:14px;padding:11px 8px;text-align:center;border-top:3px solid var(--sc);border-inline:1px solid var(--line);border-bottom:1px solid var(--line);}
  .stat .n{font-family:var(--font-mono);font-weight:700;font-size:19px;}
  .stat .l{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .hist-list{max-height:300px;overflow-y:auto;}
  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-date{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;}
  .hist-mid{flex:1;min-width:0;}
  .hist-name{font-weight:600;}
  .hist-note{font-size:11.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-pct{font-family:var(--font-mono);font-weight:700;}
  .hist-empty{color:var(--text-dim);font-size:13px;padding:12px 0;text-align:center;line-height:1.6;}

  .log-table-wrap{max-height:330px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;}
  .log-table{width:100%;border-collapse:collapse;font-size:13px;}
  .log-table th{position:sticky;top:0;background:var(--surface-2);color:var(--text-dim);font-size:11.5px;font-weight:600;padding:8px 6px;z-index:1;}
  .log-table td{padding:4px 6px;border-top:1px solid var(--line);}
  .log-table .day-cell{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;white-space:nowrap;}
  .log-table input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font-mono);font-size:14px;text-align:center;padding:6px 2px;}
  .log-table tr.today-row td{background:color-mix(in srgb, var(--pc) 14%, transparent);}
  .log-note{margin-top:10px;font-size:12px;color:var(--text-dim);line-height:1.6;}

  details.panel{margin-top:14px;background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:2px 14px;}
  details.panel summary{cursor:pointer;padding:13px 0;font-weight:700;font-family:var(--font-display);font-size:14.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details.panel summary::-webkit-details-marker{display:none;}
  details.panel summary::after{content:'+';font-size:20px;color:var(--text-dim);}
  details.panel[open] summary::after{content:'–';}
  .panel-body{padding-bottom:14px;color:var(--text-dim);font-size:13.5px;line-height:1.7;}
  .panel-body p{margin:8px 0;}
  .panel-body b{color:var(--text);}
  .backup-area{width:100%;height:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:8px;margin-top:8px;direction:ltr;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn.primary{background:var(--pc);color:#1a1826;border-color:transparent;}
  .btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line));}

  .sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-top:14px;justify-content:center;}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
  .sync.ok i{background:var(--green);}
  .sync.off i{background:var(--yellow);}

  .rest-bar{
    position:fixed;bottom:calc(16px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(200%);
    background:var(--surface);border:1px solid var(--dc);color:var(--text);padding:9px 12px;border-radius:20px;
    display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-weight:700;font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .25s;z-index:30;
  }
  .rest-bar.show{transform:translateX(-50%) translateY(0);}
  .rest-ring{width:34px;height:34px;flex-shrink:0;}
  .rest-ring circle{fill:none;stroke-width:4;}
  .rest-ring .bg{stroke:var(--surface-2);}
  .rest-ring .fg{stroke:var(--dc);stroke-linecap:round;transition:stroke-dashoffset .95s linear;}
  .rest-bar button{background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-weight:700;border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font-body);}
  .rest-bar .skip{background:var(--dc);color:#1a1826;border-color:transparent;}

  .toast{
    position:fixed;top:calc(14px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-16px);
    background:var(--surface-2);border:1px solid var(--line);padding:9px 16px;border-radius:20px;font-size:12.5px;
    color:var(--text);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;
    box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading,.error{margin-top:40px;text-align:center;color:var(--text-dim);font-size:14px;}
  .error{color:var(--red);}
</style>
</head>

function LS(k, v){
  try{
    if(v===undefined) return localStorage.getItem(k);
    if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  }catch(e){ return null; }
}

}

function normalize(d){
  const out = Object.assign(emptyData(), d||{});
  ['weights','sessions','daily','cardio'].forEach(k=>{ if(!out[k] || typeof out[k]!=='object') out[k]={}; });
  (CFG.programs||[]).filter(p=>p.type==='cardio').forEach(p=>p.kinds.forEach(k=>{
    const c = out.cardio[k.id];
    out.cardio[k.id] = {stage:(c&&+c.stage)||0, log:(c&&Array.isArray(c.log))?c.log:[]};
  }));
  return out;
}

async function pullRemote(){
  if(!SB) return null;
  const p = PROFILE;
  const [w, ws, wk, cl, cs, dl] = await Promise.all([
    SB.from('exercise_state').select('ex_key,current_weight').eq('profile_id',p),
    SB.from('workout_sets').select('date,program_id,ex_key,set_index,weight,reps,done').eq('profile_id',p),
    SB.from('workouts').select('date,program_id,note').eq('profile_id',p),
    SB.from('cardio_log').select('kind,date,minutes,km,rpe').eq('profile_id',p),
    SB.from('cardio_state').select('kind,stage').eq('profile_id',p),
    SB.from('daily_log').select('date,steps,body_weight').eq('profile_id',p)
  ]);
  const err = [w,ws,wk,cl,cs,dl].find(r=>r.error);
  if(err) throw err.error;

  const d = emptyData();
  (w.data||[]).forEach(r=>{ if(r.current_weight!=null) d.weights[r.ex_key]=Number(r.current_weight); });
  (wk.data||[]).forEach(r=>{
    const key = r.date+'_'+r.program_id;
    d.sessions[key] = {day:r.program_id, date:r.date, note:r.note||'', sets:blankSets(r.program_id)};
  });
  (ws.data||[]).forEach(r=>{
    const key = r.date+'_'+r.program_id;
    if(!d.sessions[key]) d.sessions[key] = {day:r.program_id, date:r.date, note:'', sets:blankSets(r.program_id)};
    const ex = exOf(r.program_id);
    const i = ex.findIndex((_,ix)=>exKey(r.program_id,ix)===r.ex_key);
    if(i<0) return;
    if(!d.sessions[key].sets[i]) d.sessions[key].sets[i]=[];
    d.sessions[key].sets[i][r.set_index] = {d:!!r.done, w:r.weight==null?null:Number(r.weight), r:r.reps==null?null:Number(r.reps)};
  });
  (cs.data||[]).forEach(r=>{ d.cardio[r.kind]=Object.assign(d.cardio[r.kind]||{log:[]},{stage:r.stage||0}); });
  (cl.data||[]).forEach(r=>{
    if(!d.cardio[r.kind]) d.cardio[r.kind]={stage:0,log:[]};
    d.cardio[r.kind].log.push({date:r.date, min:Number(r.minutes), km:r.km==null?null:Number(r.km), rpe:r.rpe||'ok'});
  });
  Object.values(d.cardio).forEach(c=>c.log.sort((a,b)=>a.date<b.date?-1:1));
  (dl.data||[]).forEach(r=>{ d.daily[r.date]={steps:r.steps, weight:r.body_weight==null?null:Number(r.body_weight)}; });
  return d;
}

function blankSets(programId){ return exOf(programId).map(e=>Array.from({length:e.sets},()=>({d:false,w:null,r:null}))); }

async function pushSession(sess){
  if(!SB) return;
  const rows = [];
  const ex = exOf(sess.day);
  (sess.sets||[]).forEach((arr,i)=>{
    if(!ex[i]) return;
    arr.forEach((c,j)=>{
      if(!c) return;
      rows.push({profile_id:PROFILE, date:sess.date, program_id:sess.day, ex_key:exKey(sess.day,i),
                 set_index:j, weight:c.w, reps:c.r, done:!!c.d});
    });
  });
  await SB.from('workouts').upsert({profile_id:PROFILE, date:sess.date, program_id:sess.day, note:sess.note||''},
    {onConflict:'profile_id,date,program_id'});
  if(rows.length) await SB.from('workout_sets').upsert(rows, {onConflict:'profile_id,date,program_id,ex_key,set_index'});
}
async function pushWeight(key, val){
  if(!SB) return;
  await SB.from('exercise_state').upsert({profile_id:PROFILE, ex_key:key, current_weight:val, updated_at:new Date().toISOString()},
    {onConflict:'profile_id,ex_key'});
}
async function pushDaily(date){
  if(!SB) return;
  const e = state.data.daily[date]||{};
  await SB.from('daily_log').upsert({profile_id:PROFILE, date, steps:e.steps==null?null:e.steps, body_weight:e.weight==null?null:e.weight},
    {onConflict:'profile_id,date'});
}
async function pushCardio(kind, entry){
  if(!SB) return;
  await SB.from('cardio_log').insert({profile_id:PROFILE, kind, date:entry.date, minutes:entry.min, km:entry.km, rpe:entry.rpe});
  await SB.from('cardio_state').upsert({profile_id:PROFILE, kind, stage:state.data.cardio[kind].stage},
    {onConflict:'profile_id,kind'});
}
async function pushAll(){
  if(!SB) return;
  for(const s of Object.values(state.data.sessions)) await pushSession(s);
  for(const k of Object.keys(state.data.weights)) await pushWeight(k, state.data.weights[k]);
  for(const d of Object.keys(state.data.daily)) await pushDaily(d);
}

/* queue of remote writes so the UI never blocks on the network */
const queue = [];
let flushing = false;
function enqueue(fn){
  if(!SB) return;
  queue.push(fn);
  if(!flushing) flush();
}
async function flush(){
  flushing = true;
  while(queue.length){
    const fn = queue.shift();
    try{ await fn(); setSync('ok'); }
    catch(e){ setSync('off'); }
  }
  flushing = false;
}
function setSync(s){
  if(state.sync===s) return;
  state.sync=s;
  const el=document.getElementById('syncDot');
  if(el){ el.className='sync '+s; el.querySelector('span').textContent = syncText(s); }
}
function syncText(s){
  if(s==='ok') return 'מסונכרן עם הענן';
  if(s==='off') return 'נשמר במכשיר — הענן לא זמין כרגע';
  return 'נשמר במכשיר בלבד';
}
function persist(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>toast('נשמר ✓'), 400);
}

const exOf = id => { const p = CFG.programs.find(x=>x.id===id); return (p && p.ex) || []; };
const isTime = reps => typeof reps==='string' && /שנ|דק/.test(reps);
const timeSecs = reps => { const m=String(reps).match(/(\d+)/); const n=m?+m[1]:0; return /דק/.test(reps)? n*60 : n; };

function getSession(dayId, create){
  const date = todayISO(), key = date+'_'+dayId;

    const blank = {day:dayId, date, sets:blankSets(dayId), note:''};

  }
  const s = state.data.sessions[key];
  exOf(dayId).forEach((e,i)=>{
    if(!s.sets[i]) s.sets[i] = Array.from({length:e.sets},()=>({d:false,w:null,r:null}));
    for(let j=0;j<e.sets;j++) if(!s.sets[i][j]) s.sets[i][j]={d:false,w:null,r:null};
  });
  return s;
}
function historyFor(dayId, excludeDate){
  return Object.values(state.data.sessions)
    .filter(s=>s.day===dayId && s.date!==excludeDate && (s.sets||[]).some(a=>a && a.some(x=>x&&x.d)))
    .sort((a,b)=> a.date<b.date?1:-1);
}
function workingWeight(dayId, i){
  const k = exKey(dayId,i);
  return state.data.weights[k]!=null ? state.data.weights[k] : null;
}
function setWorkingWeight(dayId, i, val){
  const k = exKey(dayId,i);
  if(val==null || val==='' || isNaN(val)) delete state.data.weights[k];
  else state.data.weights[k] = Number(val);
  persist();
  enqueue(()=>pushWeight(k, state.data.weights[k]==null?null:state.data.weights[k]));
}

/* ================= math ================= */
const e1rm = (w,r) => (w>0 && r>0) ? w*(1+r/30) : 0;
const setsDone = s => (s.sets||[]).reduce((a,arr)=>a+(arr||[]).filter(x=>x&&x.d).length,0);
const setsTotal = dayId => exOf(dayId).reduce((a,e)=>a+e.sets,0);
const volumeOf = s => (s.sets||[]).reduce((a,arr)=>a+(arr||[]).reduce((b,x)=>b+(x&&x.d?(x.w||0)*(x.r||0):0),0),0);
function sessionPct(s){ const t=setsTotal(s.day); return t?Math.round(setsDone(s)/t*100):0; }
const sessionDone = s => sessionPct(s)>=80;

function bestE1RM(dayId, exIdx, beforeDate){
  let best=0, bw=0;
  Object.values(state.data.sessions).forEach(s=>{
    if(s.day!==dayId) return;
    if(beforeDate && s.date>=beforeDate) return;
    ((s.sets||[])[exIdx]||[]).forEach(x=>{ if(x&&x.d){ const e=e1rm(x.w,x.r); if(e>best){best=e;bw=x.w;} } });
  });
  return {e:best, w:bw};
}
function lastRepsFor(dayId, exIdx, setIdx){
  for(const s of historyFor(dayId, todayISO())){
    const arr=(s.sets||[])[exIdx]||[];
    if(arr[setIdx] && arr[setIdx].d && arr[setIdx].r!=null) return arr[setIdx].r;
    const any=arr.filter(x=>x&&x.d&&x.r!=null);
    if(any.length) return any[any.length-1].r;
  }
  return null;
}
function coachFor(dayId, exIdx){
  const exo = exOf(dayId)[exIdx];
  if(!exo) return null;
  const target = typeof exo.reps==='number' ? exo.reps : null;
  const hist = historyFor(dayId, todayISO()).slice(0,2)
    .map(s=>((s.sets||[])[exIdx]||[]).filter(x=>x&&x.d)).filter(a=>a.length);
  if(!hist.length) return {type:'first'};
  const ok = arr => arr.length>=exo.sets && (!target || arr.every(x=>(x.r||0)>=target));
  const topW = arr => Math.max(0, ...arr.map(x=>x.w||0));
  const lastOK = ok(hist[0]), prevOK = hist[1]?ok(hist[1]):false;
  const w = topW(hist[0]);
  if(!exo.w) return (lastOK&&prevOK) ? {type:'up', reps:(target||0)+2, bw:true} : {type:'hold', bw:true};
  if(!w) return {type:'hold'};
  if(lastOK&&prevOK) return {type:'up', from:w, to:r05(w+(exo.inc||2.5))};
  if(lastOK) return {type:'almost', from:w};
  return {type:'hold', from:w};
}

function sessionsOn(dateStr){ return Object.values(state.data.sessions).filter(s=>s.date===dateStr && setsDone(s)>0); }
function cardioOn(dateStr){
  const out=[];
  Object.keys(state.data.cardio).forEach(k=>(state.data.cardio[k].log||[]).forEach(l=>{ if(l.date===dateStr) out.push(Object.assign({kind:k},l)); }));
  return out;
}
const activeOn = d => sessionsOn(d).length>0 || cardioOn(d).length>0;
function last7(){ const a=[]; for(let i=6;i>=0;i--) a.push(dISO(addDays(new Date(),-i))); return a; }
function weekCount(){ const ws=startOfWeek(new Date()); let c=0; for(let i=0;i<7;i++){ const d=addDays(ws,i); if(d>new Date()) break; if(activeOn(dISO(d))) c++; } return c; }
function activeDaysIn(ws){ let c=0; for(let i=0;i<7;i++) if(activeOn(dISO(addDays(ws,i)))) c++; return c; }
function earliestDate(){
  const ds = Object.values(state.data.sessions).map(s=>s.date)
    .concat(...Object.values(state.data.cardio).map(k=>(k.log||[]).map(l=>l.date)));
  return ds.length ? ds.sort()[0] : null;
}
function weekStreak(){
  const f = earliestDate(); if(!f) return 0;
  const fws = startOfWeek(parseISO(f));
  let ws=startOfWeek(new Date()), streak=0, cur=true, g=0;
  while(ws>=fws && g++<200){
    if(activeDaysIn(ws)>=CFG.weekGoal) streak++;
    else if(!cur) break;
    cur=false; ws=addDays(ws,-7);
  }
  return streak;
}
function totalWorkouts(){
  return Object.values(state.data.sessions).filter(sessionDone).length
       + Object.values(state.data.cardio).reduce((a,k)=>a+(k.log||[]).length,0);
}
function lastActiveDate(){
  const ds = Object.values(state.data.sessions).filter(s=>setsDone(s)>0).map(s=>s.date)
    .concat(...Object.values(state.data.cardio).map(k=>(k.log||[]).map(l=>l.date)));
  return ds.length ? ds.sort().reverse()[0] : null;
}
function heatMap(){
  const days=last7(), m={};
  Object.values(state.data.sessions).forEach(s=>{
    if(days.indexOf(s.date)<0) return;
    const ex=exOf(s.day);
    (s.sets||[]).forEach((arr,i)=>{
      const n=(arr||[]).filter(x=>x&&x.d).length;
      if(!n||!ex[i]) return;
      (ex[i].hl||[]).forEach(k=>m[k]=(m[k]||0)+n);
    });
  });
  return m;
}
function weeklyVolume(n){
  const out=[]; let ws=startOfWeek(new Date());
  for(let i=0;i<n;i++){
    const s=dISO(ws), e=dISO(addDays(ws,6));
    const v=Object.values(state.data.sessions).filter(x=>x.date>=s&&x.date<=e).reduce((a,x)=>a+volumeOf(x),0);
    out.unshift({x:s, y:Math.round(v), label:pad2(ws.getDate())+'/'+pad2(ws.getMonth()+1)});
    ws=addDays(ws,-7);
  }
  return out;
}
function e1rmSeries(dayId, exIdx){
  return historyFor(dayId,null).slice().reverse().map(s=>{
    const arr=((s.sets||[])[exIdx]||[]).filter(x=>x&&x.d);
    const b=Math.max(0,...arr.map(x=>e1rm(x.w,x.r)));
    return b>0?{x:s.date, y:Math.round(b*10)/10, label:s.date.slice(5).replace('-','/')}:null;
  }).filter(Boolean);
}

function lineChart(pts,o){
  o=o||{};
  const W=320,H=o.h||120,L=34,R=8,T=12,B=20;
  if(pts.length<2) return '<div class="chart-empty">'+(o.empty||'צריך לפחות שתי מדידות כדי לצייר גרף.')+'</div>';
  const ys=pts.map(p=>p.y);
  let min=Math.min(...ys), max=Math.max(...ys);
  if(max===min){ max=min+1; min=Math.max(0,min-1); }
  const X=i=>L+i*(W-L-R)/(pts.length-1), Y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+' L '+X(pts.length-1).toFixed(1)+' '+(H-B)+' L '+X(0).toFixed(1)+' '+(H-B)+' Z';
  const c=o.color||'var(--pc)', gid='g'+Math.random().toString(36).slice(2,7);
  const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?3.4:2)+'" fill="'+c+'"/>').join('');
  const fmt=o.fmt||(v=>Math.round(v));
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".28"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'
    +'<line x1="'+L+'" y1="'+T+'" x2="'+(W-R)+'" y2="'+T+'" stroke="var(--line)" stroke-dasharray="2 4"/>'
    +'<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--line)"/>'
    +'<text x="'+(L-5)+'" y="'+(T+4)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">'+fmt(max)+'</text>'
    +'<text x="'+(L-5)+'" y="'+(H-B)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">'+fmt(min)+'</text>'
    +'<path d="'+area+'" fill="url(#'+gid+')"/><path d="'+line+'" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots
    +'<text x="'+X(0).toFixed(1)+'" y="'+(H-6)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="start">'+esc(pts[0].label||'')+'</text>'
    +'<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(H-6)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">'+esc(pts[pts.length-1].label||'')+'</text>'
    +'</svg></div>';
}
function barChart(pts,o){

/* ================= rest timer & toast ================= */
function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    [0,160,320].forEach(t=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=880;
      const at=audioCtx.currentTime+t/1000;
      g.gain.setValueAtTime(.0001,at);
      g.gain.exponentialRampToValueAtTime(.22,at+.02);
      g.gain.exponentialRampToValueAtTime(.0001,at+.16);
      o.connect(g); g.connect(audioCtx.destination); o.start(at); o.stop(at+.2);
    });
  }catch(e){}
}
function paintRest(){
  document.getElementById('restTime').textContent = Math.floor(restLeft/60)+':'+pad2(restLeft%60);
  const ring=document.getElementById('restRing'), C=2*Math.PI*16;
  ring.setAttribute('stroke-dasharray',C);
  ring.setAttribute('stroke-dashoffset',(C*(1-restLeft/Math.max(1,restTotal))).toFixed(1));
}
function stopRest(){ clearInterval(restInt); restInt=null; document.getElementById('restBar').classList.remove('show'); }
function startRest(sec){
  clearInterval(restInt); restLeft=sec; restTotal=sec;
  document.getElementById('restBar').classList.add('show'); paintRest();
  restInt=setInterval(()=>{
    restLeft--;
    if(restLeft<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([120,60,120]); beep(); return; }
    paintRest();
  },1000);
}
const restSecs = exo => isTime(exo.reps)?45:(exo.sets>=3?90:60);
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1600);
}

/* ================= actions ================= */
function suggestDay(){
  const st = CFG.programs.filter(p=>p.type==='strength');
  if(st.length<2) return st.length?st[0].id:CFG.programs[0].id;
  const today=todayISO();
  const done = st.find(p=>{ const s=state.data.sessions[today+'_'+p.id]; return s&&setsDone(s)>0; });
  if(done) return done.id;
  const last = Object.values(state.data.sessions).filter(s=>setsDone(s)>0).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!last) return st[0].id;
  const i = st.findIndex(p=>p.id===last.day);
  return i<0 ? st[0].id : st[(i+1)%st.length].id;
}
function toggleSet(exIdx,setIdx){
  const s=getSession(state.day,true), exo=exOf(state.day)[exIdx], cell=s.sets[exIdx][setIdx];
  if(cell.d){ cell.d=false; }
  else{
    if(cell.w==null && exo.w) cell.w = workingWeight(state.day,exIdx);
    if(cell.r==null) cell.r = lastRepsFor(state.day,exIdx,setIdx) != null
      ? lastRepsFor(state.day,exIdx,setIdx)
      : (typeof exo.reps==='number'?exo.reps:null);
    const before=bestE1RM(state.day,exIdx,todayISO());
    cell.d=true;
    if(exo.w && before.e>0 && e1rm(cell.w,cell.r)>before.e*1.005) toast('🏆 שיא אישי ב'+exo.n.split('(')[0].trim());
    const rs=restSecs(exo); if(rs) startRest(rs);
  }
  persist(); enqueue(()=>pushSession(s)); render();
}
function bumpWeight(exIdx,delta){
  const exo=exOf(state.day)[exIdx];
  const cur=workingWeight(state.day,exIdx);
  const step=delta*(exo.inc||2.5);
  const next=Math.max(0, r05((cur==null?0:cur)+step));
  applyWeight(exIdx,next);
}
function applyWeight(exIdx,val){
  setWorkingWeight(state.day,exIdx,val);
  const s=getSession(state.day,true);
  s.sets[exIdx].forEach(c=>{ if(!c.d) c.w = (val===''||val==null)?null:Number(val); });
  enqueue(()=>pushSession(s));
  render();
}
function saveCardio(){
  const kind=state.kind;
  const minEl=document.getElementById('cMin'), kmEl=document.getElementById('cKm');
  const min=Number(minEl.value);
  if(!min||min<=0){ minEl.focus(); toast('כמה דקות עשית?'); return; }
  const c=state.data.cardio[kind];
  const entry={date:todayISO(), min, km:kmEl.value?Number(kmEl.value):null, rpe:state.rpe||'ok'};
  c.log.push(entry);
  const stages=progOf('cardio').kinds.find(k=>k.id===kind).stages;
  const l2=c.log.slice(-2);
  if(l2.length===2 && l2.every(l=>l.rpe!=='hard') && c.stage<stages.length-1){
    c.stage++; toast('עלית לשלב '+(c.stage+1)+' 🎉');
  }
  state.rpe=null;
  persist(); enqueue(()=>pushCardio(kind,entry)); render();
}
function updateDaily(date,field,val){
  if(!state.data.daily[date]) state.data.daily[date]={};
  state.data.daily[date][field]= val===''?null:Number(val);
  persist(); enqueue(()=>pushDaily(date));
}
function go(screen,opts){
  Object.assign(state,{screen}, opts||{});
  render();
  window.scrollTo(0,0);
}

/* ================= screen: home ================= */
function screenHome(){
  const today=todayISO(), sug=suggestDay();
  const hour=new Date().getHours();
  const greet = hour<11?'בוקר טוב':(hour<17?'צוהריים טובים':(hour<21?'ערב טוב':'לילה טוב'));
  const last=lastActiveDate();
  const gap = last? Math.round((parseISO(today)-parseISO(last))/86400000) : null;
  const gapTxt = gap===null?'עוד לא נרשם אימון':(gap===0?'התאמנת היום 💪':(gap===1?'האימון האחרון היה אתמול':'עברו '+gap+' ימים מהאימון האחרון'));

  const tiles = CFG.programs.map(p=>{
    const s=state.data.sessions[today+'_'+p.id];
    const doneToday = p.type==='cardio'
      ? (state.data.cardio[p.kinds[0].id]||{log:[]}).log.some(l=>l.date===today) ||
        (state.data.cardio[(p.kinds[1]||p.kinds[0]).id]||{log:[]}).log.some(l=>l.date===today)
      : !!(s && setsDone(s)>0);
    const pct = (p.type==='strength' && s) ? sessionPct(s) : 0;
    let flag='';
    if(doneToday && (p.type==='cardio'||pct>=80)) flag='<span class="flag">היום ✓</span>';
    else if(doneToday) flag='<span class="flag">'+pct+'%</span>';
    else if(p.id===sug && p.type==='strength') flag='<span class="flag">התור שלו</span>';
    return '<button class="tile'+(doneToday?' done':'')+'" style="--tc:'+p.hex+'" data-act="open" data-v="'+p.id+'">'
      +flag+'<span class="ic">'+p.icon+'</span><span class="t">'+esc(p.label)+'</span><span class="s">'+esc(p.tile||p.sub||'')+'</span></button>';
  }).join('');

  return '<div class="wrap"><div class="hero">'
    +'<div class="hello">'+greet+',<br><span>'+esc(CFG.name)+'</span> 👋</div>'
    +'<div class="hero-sub">'+gapTxt+'</div><div class="rainbow-bar"></div>'
    +'<div class="hero-stats">'
    +'<div class="hstat" style="--sc:var(--pc)"><div class="n">'+weekCount()+'/'+CFG.weekGoal+'</div><div class="l">אימונים השבוע</div></div>'
    +'<div class="hstat" style="--sc:var(--green)"><div class="n">'+weekStreak()+'</div><div class="l">רצף שבועות</div></div>'
    +'<div class="hstat" style="--sc:var(--yellow)"><div class="n">'+totalWorkouts()+'</div><div class="l">סה״כ אימונים</div></div>'
    +'</div></div>'
    +'<div class="tiles">'+tiles
    +'<button class="tile" style="--tc:var(--pc)" data-act="open" data-v="__progress"><span class="ic">📈</span>'
    +'<span class="t">התקדמות</span><span class="s">לוח חודשי, גרפים ושיאים</span></button>'
    +'<button class="tile" style="--tc:#A9A6C4" data-act="open" data-v="__log"><span class="ic">📓</span>'
    +'<span class="t">יומן</span><span class="s">צעדים, משקל וגיבוי</span></button>'
    +'</div>'
    +'<div class="sync '+state.sync+'" id="syncDot"><i></i><span>'+syncText(state.sync)+'</span></div>'
    +'<button class="switch-user" data-act="switch">מחליפים משתמש</button>'

/* ================= screen: workout ================= */
function topbar(title,sub,pill){
  return '<div class="topbar"><button class="back" data-act="home" aria-label="חזרה">›</button>'
    +'<h1>'+esc(title)+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</h1>'
    +(pill?'<span class="pill">'+esc(pill)+'</span>':'')+'</div>';
}
function screenWorkout(){
  const prog=progOf(state.day), ex=prog.ex, s=getSession(state.day,false);
  const total=setsTotal(state.day), done=setsDone(s), pct=total?Math.round(done/total*100):0;
  const vol=Math.round(volumeOf(s));

  const cards=ex.map((exo,i)=>{
    const arr=s.sets[i]||[], allDone=arr.length&&arr.every(x=>x.d);
    const ww=workingWeight(state.day,i);
    const c=coachFor(state.day,i);
    let coachHTML='';
    if(c&&c.type==='up'&&!c.bw) coachHTML='<div class="coach up">📈 עברת פעמיים ברצף — <b>תעלה ל־'+c.to+' ק״ג</b><button class="apply" data-act="coach" data-ex="'+i+'" data-w="'+c.to+'">קבע</button></div>';
    else if(c&&c.type==='up'&&c.bw) coachHTML='<div class="coach up">📈 קל לך — <b>נסה '+c.reps+' חזרות בסט</b></div>';
    else if(c&&c.type==='almost') coachHTML='<div class="coach">🔸 אימון מוצלח אחד ב־<b>'+c.from+' ק״ג</b>. עוד אחד כזה ואפשר להעלות.</div>';
    else if(c&&c.type==='hold'&&c.from) coachHTML='<div class="coach">🔹 בפעם שעברה <b>'+c.from+' ק״ג</b> — תשלים את כל הסטים לפני שמעלים.</div>';
    else if(c&&c.type==='first') coachHTML='<div class="coach">✨ פעם ראשונה — תתחיל קל, בטכניקה נקייה. מה שתרשום היום נשמר כמשקל ההתחלה לפעם הבאה.</div>';

    const wwRow = exo.w
      ? '<div class="ww"><span class="lbl">משקל עבודה</span>'
        +'<button class="step" data-act="ww" data-ex="'+i+'" data-d="-1" aria-label="הורד משקל">−</button>'
        +'<input type="number" inputmode="decimal" step="0.5" min="0" data-k="ww-'+i+'" value="'+(ww==null?'':ww)+'" placeholder="—" aria-label="משקל עבודה">'
        +'<span class="unit">ק״ג</span>'
        +'<button class="step" data-act="ww" data-ex="'+i+'" data-d="1" aria-label="העלה משקל">+</button>'
        +'<span class="saved">'+(ww==null?'קבע פעם אחת<br>וזה יישמר':'נשמר לפעם<br>הבאה ✓')+'</span></div>'
      : '';

    const rows=arr.map((cell,j)=>{
      const shownW = cell.w!=null ? cell.w : (cell.d?'':(ww==null?'':ww));
      const wField = exo.w
        ? '<div class="field"><input type="number" inputmode="decimal" step="0.5" min="0" data-k="w-'+i+'-'+j+'" value="'+shownW+'" placeholder="—" aria-label="משקל סט '+(j+1)+'"></div>'
        : '<div class="field"><input type="text" value="משקל גוף" disabled></div>';
      const lastR=lastRepsFor(state.day,i,j);
      const ph = typeof exo.reps==='number'?exo.reps:(lastR!=null?lastR:'—');
      const rField = isTime(exo.reps)
        ? '<div class="field"><input type="text" value="'+esc(String(exo.reps))+'" disabled></div>'
        : '<div class="field"><input type="number" inputmode="numeric" step="1" min="0" data-k="r-'+i+'-'+j+'" value="'+(cell.r==null?'':cell.r)+'" placeholder="'+ph+'" aria-label="חזרות סט '+(j+1)+'"></div>';
      return '<div class="set-row'+(cell.d?' done':'')+'"><span class="set-n">'+(j+1)+'</span>'+wField+rField
        +'<button class="check'+(cell.d?' on':'')+'" data-act="ck" data-ex="'+i+'" data-set="'+j+'" aria-pressed="'+cell.d+'" aria-label="סיימתי סט '+(j+1)+'">✓</button></div>';
    }).join('');

    const hold=isTime(exo.reps)?'<button class="btn" style="margin-top:8px;width:100%" data-act="hold" data-sec="'+timeSecs(exo.reps)+'">▶︎ טיימר '+esc(String(exo.reps))+'</button>':'';
    const ok='c'+state.day+'-'+i;
    return '<div class="ex-card'+(allDone?' complete':'')+'" style="--dc:'+prog.hex+'">'
      +'<div class="ex-top"><div class="pictogram">'+bodySVG(exo.view,exo.hl)
      +'<span class="view-tag">'+(exo.view==='back'?'מאחור':'מלפנים')+'</span>'
      +(exo.equip&&exo.equip!=='bodyweight'?'<div class="equip-badge">'+equipIcon(exo.equip,prog.hex)+'</div>':'')+'</div>'
      +'<div class="ex-head"><div class="ex-name">'+esc(exo.n)+'</div>'
      +'<div class="ex-meta">יעד: '+exo.sets+'×'+esc(String(exo.reps))+'</div>'
      +(exo.w?'<div class="ex-spark">'+sparkline(e1rmSeries(state.day,i),prog.hex)+'</div>':'')
      +'</div></div>'+wwRow+coachHTML
      +'<div class="sets"><div class="set-head"><span></span><span>'+(exo.w?'ק״ג':'')+'</span><span>'+(isTime(exo.reps)?'זמן':'חזרות')+'</span><span></span></div>'+rows+'</div>'
      +hold
      +'<details class="cues" data-okey="'+ok+'"'+(state.open[ok]?' open':'')+'><summary>דגשי טכניקה</summary><ul>'
      +(exo.cues||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details></div>';
  }).join('');

  let summary='';
  if(pct>=80){
    const prev=historyFor(state.day,todayISO())[0];
    const pv=prev?Math.round(volumeOf(prev)):0;
    const diff=pv?Math.round((vol-pv)/pv*100):null;
    summary='<div class="card" style="margin-top:14px;border-color:'+prog.hex+'">'
      +'<div class="sec-title" style="margin-bottom:6px">✅ סיימת את '+esc(prog.label)+'</div>'
      +'<div class="kpis"><div class="kpi"><div class="n">'+num(vol)+'</div><div class="l">ק״ג הורמו</div></div>'
      +'<div class="kpi"><div class="n">'+done+'</div><div class="l">סטים</div></div>'
      +'<div class="kpi"><div class="n" style="color:'+(diff!=null&&diff>=0?'var(--green)':'var(--text)')+'">'+(diff!=null?(diff>0?'+':'')+diff+'%':'—')+'</div><div class="l">מול הפעם הקודמת</div></div></div></div>';
  }

  return '<div class="wrap">'+topbar(prog.label, prog.sub||'', s.date)
    +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+prog.hex+'"></div></div>'
    +'<div class="progress-label"><span>'+done+' / '+total+' סטים</span><span>'+(vol?num(vol)+' ק״ג נפח':'')+'</span></div>'
    +'<div class="ex-list">'+cards+'</div>'
    +'<div class="note-row"><input type="text" data-k="note" value="'+esc(s.note||'')+'" placeholder="הערה לאימון של היום"></div>'
    +summary+'</div>';
}

/* ================= screen: cardio ================= */

    +(last?'<div class="cardio-last">בפעם שעברה: '+last.min+' דק׳'+(last.km?' · '+last.km+' ק"מ':'')+(sp?' · <span class="cardio-speed">'+sp+' קמ"ש</span>':'')+'</div>':'')

      +lineChart(c.log.filter(l=>l.km).map(l=>({x:l.date,y:Math.round(l.km/(l.min/60)*10)/10,label:l.date.slice(5).replace('-','/')})),{color:prog.hex,fmt:v=>v.toFixed(1)})
      +'</div></div>':'')

/* ================= screen: progress ================= */
function monthCalendar(){
  const y=state.calY, m=state.calM, today=todayISO();
  const first=new Date(y,m,1), daysIn=new Date(y,m+1,0).getDate();
  const lead=first.getDay();
  const now=new Date(), isCur=(y===now.getFullYear()&&m===now.getMonth());
  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="cal-cell blank"></div>';
  let monthWorkouts=0, monthVol=0;
  for(let d=1;d<=daysIn;d++){
    const ds=y+'-'+pad2(m+1)+'-'+pad2(d);
    const ss=sessionsOn(ds), cc=cardioOn(ds);
    const dots=ss.map(s=>'<i style="background:'+progOf(s.day).hex+'"></i>').join('')
      + cc.map(()=>'<i style="background:'+((CFG.programs.find(p=>p.type==='cardio')||{hex:'var(--blue)'}).hex)+'"></i>').join('');
    const has=ss.length||cc.length;
    if(has){ monthWorkouts++; monthVol+=ss.reduce((a,s)=>a+volumeOf(s),0); }
    const bg = has ? 'background:color-mix(in srgb,'+(ss.length?progOf(ss[0].day).hex:'var(--blue)')+' 22%, var(--surface-2));' : '';
    cells+='<div class="cal-cell'+(has?' has':'')+(ds===today?' today':'')+(state.calSel===ds?' sel':'')+'" '
      +(has?'data-act="calday" data-v="'+ds+'"':'')+' style="'+bg+'">'+d
      +(dots?'<span class="cal-dots">'+dots+'</span>':'')+'</div>';
  }
  const legend = CFG.programs.map(p=>'<span><i style="background:'+p.hex+'"></i>'+esc(p.label)+'</span>').join('');

  let detail='';
  if(state.calSel){
    const ss=sessionsOn(state.calSel), cc=cardioOn(state.calSel);
    const lines = ss.map(s=>{
      const v=Math.round(volumeOf(s));
      return '<div>'+esc(progOf(s.day).label)+' — '+sessionPct(s)+'% · '+setsDone(s)+' סטים'+(v?' · '+num(v)+' ק״ג':'')+(s.note?' · '+esc(s.note):'')+'</div>';
    }).concat(cc.map(l=>'<div>אירובי ('+(l.kind==='running'?'ריצה':'אופניים')+') — '+l.min+' דק׳'+(l.km?' · '+l.km+' ק"מ':'')+'</div>'));
    const dt=parseISO(state.calSel);
    detail='<div class="cal-detail"><div class="d">יום '+WEEKDAY_HE[dt.getDay()]+', '+dt.getDate()+' ב'+MONTH_HE[dt.getMonth()]+'</div>'+(lines.join('')||'לא נרשם אימון')+'</div>';
  }

  return '<div class="card"><div class="cal-nav">'
    +'<button data-act="mon" data-v="-1">‹ קודם</button>'
    +'<span class="cal-title">'+MONTH_HE[m]+' '+y+'</span>'
    +'<button data-act="mon" data-v="1" '+(isCur?'disabled':'')+'>הבא ›</button></div>'
    +'<div class="cal-grid">'+WEEKDAY_HE.map(w=>'<div class="cal-wd">'+w+'</div>').join('')+cells+'</div>'
    +'<div class="cal-sum">'
    +'<div class="stat" style="--sc:var(--pc)"><div class="n">'+monthWorkouts+'</div><div class="l">ימי אימון החודש</div></div>'
    +'<div class="stat" style="--sc:var(--green)"><div class="n">'+num(Math.round(monthVol))+'</div><div class="l">ק״ג הורמו החודש</div></div>'
    +'</div>'+detail
    +'<div class="cal-legend">'+legend+'</div>'
    +'<div class="log-note">כל ריבוע צבוע הוא יום שבו נרשם אימון. לחיצה על יום מראה מה נעשה בו.</div></div>';
}
function screenProgress(){
  const heat=heatMap();
  const missing=KEY_MUSCLES.filter(k=>!heat[k]).map(k=>MUSCLE_HE[k]);
  const st=CFG.programs.filter(p=>p.type==='strength');

  const series=e1rmSeries(prog.id,idx), best=bestE1RM(prog.id,idx);
  const bestW=Math.max(0,...Object.values(state.data.sessions).filter(s=>s.day===prog.id)
    .flatMap(s=>((s.sets||[])[idx]||[]).filter(x=>x&&x.d).map(x=>x.w||0)));
  const cnt=historyFor(prog.id,null).filter(s=>((s.sets||[])[idx]||[]).some(x=>x&&x.d)).length;
  const bodyRows=Object.entries(state.data.daily).filter(([,v])=>v&&v.weight!=null)
    .sort((a,b)=>a[0]<b[0]?-1:1).slice(-20).map(([d,v])=>({x:d,y:v.weight,label:d.slice(5).replace('-','/')}));

  return '<div class="wrap">'+topbar('התקדמות','כל מה שנרשם עד היום')

    +'<div class="heat-legend"><span>מעט</span><i style="background:var(--pc);opacity:.34"></i><i style="background:var(--pc);opacity:.64"></i><i style="background:var(--pc);opacity:1"></i><span>הרבה</span></div>'
    +(missing.length?'<div class="heat-miss">השבוע עוד לא נגעת ב־<b>'+missing.join(' · ')+'</b></div>':'<div class="heat-miss">כיסית את כל קבוצות השרירים העיקריות השבוע 👌</div>')
    +'</div></div>'
    +'<div class="sec"><div class="sec-title">כוח לפי תרגיל<span class="hint">משקל מרבי משוער</span></div><div class="card">'
    +(st.length>1?'<select class="ex-picker" data-act="chartday">'+st.map(p=>'<option value="'+p.id+'"'+(p.id===prog.id?' selected':'')+'>'+esc(p.label)+'</option>').join('')+'</select>':'')
    +'<select class="ex-picker" data-act="chartex">'+list.map((e,i)=>'<option value="'+i+'"'+(i===idx?' selected':'')+'>'+esc(e.n)+'</option>').join('')+'</select>'
    +lineChart(series,{color:prog.hex,empty:'עוד אין מספיק נתונים על התרגיל הזה. אחרי שני אימונים תופיע כאן עקומה.'})
    +'<div class="kpis"><div class="kpi"><div class="n">'+(bestW||'—')+'</div><div class="l">משקל שיא (ק״ג)</div></div>'
    +'<div class="kpi"><div class="n">'+(best.e?Math.round(best.e):'—')+'</div><div class="l">1RM משוער</div></div>'
    +'<div class="kpi"><div class="n">'+cnt+'</div><div class="l">אימונים בתרגיל</div></div></div></div></div>'
    +'<div class="sec"><div class="sec-title">נפח אימונים<span class="hint">ק״ג בשבוע</span></div><div class="card">'+barChart(weeklyVolume(8),{color:CFG.accent})+'</div></div>'
    +(bodyRows.length>1?'<div class="sec"><div class="sec-title">משקל גוף<span class="hint">מהיומן</span></div><div class="card">'
      +lineChart(bodyRows,{color:'var(--blue)',fmt:v=>v.toFixed(1)})
      +'<div class="log-note">המשקל קופץ מיום ליום בגלל מים ואוכל — מסתכלים על הקו לאורך שבועות, לא על מדידה בודדת.</div></div></div>':'')
    +'<div class="sec"><div class="sec-title">אימונים אחרונים</div><div class="card">'+historyList()+'</div></div></div>';
}
function historyList(){
  const rows=Object.values(state.data.sessions).filter(s=>setsDone(s)>0).sort((a,b)=>a.date<b.date?1:-1).slice(0,15);
  if(!rows.length) return '<div class="hist-empty">עוד לא נשמרו אימונים.<br>סמן סט אחד וזה יופיע כאן.</div>';
  return '<div class="hist-list">'+rows.map(s=>{
    const p=progOf(s.day), v=Math.round(volumeOf(s));
    return '<div class="hist-row"><span class="hist-date">'+s.date.slice(5).replace('-','/')+'</span>'
      +'<div class="hist-mid"><div class="hist-name">'+esc(p.label)+'</div>'
      +'<div class="hist-note">'+(s.note?esc(s.note):(v?num(v)+' ק״ג נפח':''))+'</div></div>'
      +'<span class="hist-pct" style="color:'+p.hex+'">'+sessionPct(s)+'%</span></div>';
  }).join('')+'</div>';
}

/* ================= screen: log ================= */
function screenLog(){
  const now=new Date();
  const isCur=state.calY===now.getFullYear()&&state.calM===now.getMonth();
  const daysIn=new Date(state.calY,state.calM+1,0).getDate();
  const lastDay=isCur?now.getDate():daysIn, today=todayISO();
  let steps=0, logged=0, rows=[];
  for(let d=1;d<=lastDay;d++){
    const ds=state.calY+'-'+pad2(state.calM+1)+'-'+pad2(d);
    const e=state.data.daily[ds]||{};
    if(e.steps!=null){ steps+=e.steps; logged++; }
    rows.push('<tr class="'+(ds===today?'today-row':'')+'"><td class="day-cell">'+d+' ('+WEEKDAY_HE[new Date(state.calY,state.calM,d).getDay()]+')</td>'
      +'<td><input type="number" min="0" step="100" inputmode="numeric" data-k="daily-'+ds+'-steps" value="'+(e.steps==null?'':e.steps)+'" placeholder="—"></td>'
      +'<td><input type="number" min="0" step="0.1" inputmode="decimal" data-k="daily-'+ds+'-weight" value="'+(e.weight==null?'':e.weight)+'" placeholder="—"></td></tr>');
  }
  return '<div class="wrap">'+topbar('יומן','צעדים, משקל וגיבוי')
    +'<div class="sec"><div class="card">'
    +'<div class="kpis"><div class="kpi"><div class="n">'+num(steps)+'</div><div class="l">צעדים החודש</div></div>'
    +'<div class="kpi"><div class="n">'+num(logged?Math.round(steps/logged):0)+'</div><div class="l">ממוצע ליום</div></div>'
    +'<div class="kpi"><div class="n">'+logged+'</div><div class="l">ימים שנרשמו</div></div></div>'
    +'<div class="cal-nav" style="margin-top:12px"><button data-act="mon" data-v="-1">‹ קודם</button>'
    +'<span class="cal-title">'+MONTH_HE[state.calM]+' '+state.calY+'</span>'
    +'<button data-act="mon" data-v="1" '+(isCur?'disabled':'')+'>הבא ›</button></div>'
    +'<div class="log-table-wrap"><table class="log-table"><thead><tr><th>יום</th><th>צעדים</th><th>משקל (ק״ג)</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'
    +'<div class="log-note">'+esc(CFG.logNote)+'</div></div></div>'
    +'<details class="panel"><summary>איך מתקדמים נכון</summary><div class="panel-body">'
    +CFG.tips.map(t=>'<p><b>'+esc(t[0])+':</b> '+esc(t[1])+'</p>').join('')+'</div></details>'
    +'<details class="panel"><summary>גיבוי, שחזור ומשתמש</summary><div class="panel-body">'
    +'<p>הנתונים נשמרים במכשיר, ואם Supabase מחובר — גם בענן, כך שאותו פרופיל נפתח בכל מכשיר.</p>'
    +'<textarea class="backup-area" id="backup" spellcheck="false">'+esc(JSON.stringify(state.data))+'</textarea>'
    +'<div class="btn-row"><button class="btn primary" data-act="copy">העתק גיבוי</button>'
    +'<button class="btn" data-act="restore">שחזר מהטקסט</button>'
    +'<button class="btn" data-act="switch">החלף משתמש</button>'
    +'<button class="btn danger" data-act="reset">מחק הכל</button></div></div></details></div>';
}

/* ================= render ================= */
function render(){
  if(state.loading){ app.innerHTML='<div class="wrap"><div class="loading">טוען...</div></div>'; return; }
  const sy=window.scrollY;
  const ae=document.activeElement, fk=(ae&&ae.dataset)?ae.dataset.k:null;
  let html='';
  if(state.screen==='pick') html=screenPick();
  else if(state.screen==='home') html=screenHome();
  else if(state.screen==='workout') html=screenWorkout();
  else if(state.screen==='cardio') html=screenCardio();
  else if(state.screen==='progress') html=screenProgress();
  else html=screenLog();
  app.innerHTML=html;
  if(fk){ const el=app.querySelector('[data-k="'+fk+'"]'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(e){} } }
  if(state.screen!=='home') window.scrollTo(0,sy);
}

/* ================= events ================= */
app.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v;
  if(a==='pick'){ enter(v); }
  else if(a==='home'){ stopRest(); go('home'); }
  else if(a==='open'){
    if(v==='__progress'){ const n=new Date(); go('progress',{calY:n.getFullYear(),calM:n.getMonth(),calSel:null,chartDay:null,chartEx:0}); }
    else if(v==='__log'){ const n=new Date(); go('log',{calY:n.getFullYear(),calM:n.getMonth()}); }
    else{ const p=progOf(v); go(p.type==='cardio'?'cardio':'workout',{day:v}); }
  }
  else if(a==='ck') toggleSet(+t.dataset.ex,+t.dataset.set);
  else if(a==='ww') bumpWeight(+t.dataset.ex,+t.dataset.d);
  else if(a==='coach') applyWeight(+t.dataset.ex,+t.dataset.w);
  else if(a==='kind'){ state.kind=v; render(); }
  else if(a==='rpe'){ state.rpe=v; render(); }
  else if(a==='savecardio') saveCardio();
  else if(a==='hold') startRest(+t.dataset.sec);
  else if(a==='calday'){ state.calSel = (state.calSel===v?null:v); render(); }
  else if(a==='mon'){
    let m=state.calM+(+v), y=state.calY;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    const n=new Date(); if(y>n.getFullYear()||(y===n.getFullYear()&&m>n.getMonth())) return;
    state.calM=m; state.calY=y; state.calSel=null; render();
  }
  else if(a==='copy'){
    const ta=document.getElementById('backup'); ta.select();
    try{ document.execCommand('copy'); toast('הגיבוי הועתק'); }catch(err){ toast('בחר והעתק ידנית'); }
  }
  else if(a==='restore'){
    try{
      const d=JSON.parse(document.getElementById('backup').value);
      if(!d||typeof d!=='object'||!d.sessions) throw 0;
      state.data=normalize(d); saveLocal(); enqueue(pushAll); render(); toast('שוחזר ✓');
    }catch(err){ toast('הטקסט לא תקין — הדבק את הגיבוי המלא'); }
  }
  else if(a==='reset'){
    if(!confirm('למחוק את כל ההיסטוריה של '+CFG.name+'? אי אפשר לשחזר בלי גיבוי.')) return;
    state.data=normalize(null); saveLocal(); render(); toast('נמחק');
  }
  else if(a==='switch'){
    LS('icon4u_profile', null);
    PROFILE=null; state.calSel=null; state.screen='pick'; render();
  }
});
app.addEventListener('change', e=>{
  const a=e.target.dataset.act;
  if(a==='chartex'){ state.chartEx=+e.target.value; render(); }
  else if(a==='chartday'){ state.chartDay=e.target.value; state.chartEx=0; render(); }
});
app.addEventListener('input', e=>{
  const k=e.target.dataset.k; if(!k) return;
  const v=e.target.value;
  if(k==='note'){ getSession(state.day,true).note=v; persist(); enqueue(()=>pushSession(getSession(state.day,true))); return; }
  if(k.indexOf('daily-')===0){ const p=k.split('-'); updateDaily(p[1]+'-'+p[2]+'-'+p[3],p[4],v); return; }
  let m=k.match(/^ww-(\d+)$/);
  if(m){
    const i=+m[1], val = v===''?null:Number(v);
    setWorkingWeight(state.day,i,val);
    const s=getSession(state.day,true);
    s.sets[i].forEach((c,j)=>{
      if(c.d) return;
      c.w = val;
      const el=app.querySelector('[data-k="w-'+i+'-'+j+'"]');
      if(el) el.value = (val==null?'':val);
    });
    enqueue(()=>pushSession(s));
    return;
  }
  m=k.match(/^([wr])-(\d+)-(\d+)$/);
  if(m){
    const s=getSession(state.day,true), i=+m[2], j=+m[3];
    s.sets[i][j][m[1]] = v===''?null:Number(v);
    if(m[1]==='w' && v!=='') setWorkingWeight(state.day,i,Number(v));
    persist(); enqueue(()=>pushSession(s));
  }
});
app.addEventListener('toggle', e=>{
  const k=e.target.dataset&&e.target.dataset.okey;
  if(k) state.open[k]=e.target.open;
}, true);
document.getElementById('restBar').addEventListener('click', e=>{
  const b=e.target.closest('[data-rest]'); if(!b) return;
  if(b.dataset.rest==='skip'){ stopRest(); return; }
  restLeft=Math.max(1,restLeft+(+b.dataset.rest)); restTotal=Math.max(restTotal,restLeft); paintRest();
});

/* ================= boot ================= */
function mergeRemote(remote){
  const local=state.data, out=normalize(remote), localOnly=[];
  Object.keys(local.sessions).forEach(k=>{ if(!out.sessions[k]){ out.sessions[k]=local.sessions[k]; localOnly.push(k); } });
  Object.keys(local.weights).forEach(k=>{ if(out.weights[k]==null) out.weights[k]=local.weights[k]; });
  Object.keys(local.daily).forEach(k=>{ if(!out.daily[k]) out.daily[k]=local.daily[k]; });
  Object.keys(local.cardio).forEach(k=>{
    if(!out.cardio[k]||!(out.cardio[k].log||[]).length) out.cardio[k]=local.cardio[k];
  });
  state.data=out; saveLocal();
  localOnly.forEach(k=>enqueue(()=>pushSession(out.sessions[k])));
}
async function enter(id){
  PROFILE=id; CFG=CATALOG[id];
  document.documentElement.style.setProperty('--pc',CFG.accent);
  document.querySelector('meta[name=theme-color]').setAttribute('content','#1F1D2B');
  LS('icon4u_profile',id);
  state.data=normalize(loadLocal(id));
  const cardioProg=CFG.programs.find(p=>p.type==='cardio');
  state.kind=cardioProg?cardioProg.kinds[0].id:null;
  state.day=suggestDay(); state.chartDay=null; state.loading=false;
  go('home');
  if(SB){
    try{ const r=await pullRemote(); mergeRemote(r); setSync('ok'); render(); }
    catch(e){ setSync('off'); }
  } else setSync('local');
}
function boot(){
  const saved=LS('icon4u_profile');
  state.loading=false;
  if(saved && CATALOG[saved]) enter(saved);
  else { state.screen='pick'; render(); }
}
boot();
})();
</script>
