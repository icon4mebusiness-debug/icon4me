<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>icon4me</title>
<meta name="description" content="מעקב אימונים אישי">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="icon4me">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1F1D2B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=Assistant:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F1D2B; --surface:#2A2838; --surface-2:#363450; --line:#494667;
    --text:#F5F3FF; --text-dim:#A9A6C4;
    --red:#FF4D6D; --blue:#3DA9FC; --yellow:#FFD23F; --green:#2FE6A7;
    --muscle:#D9D6EC; --pc:#5EE7FF; --ink:#1a1826; --body-line:#141323;
    --shadow:0 10px 30px rgba(0,0,0,.45); --shadow-s:0 4px 14px rgba(0,0,0,.3);
    --glass:rgba(42,40,56,.86);
    --font-display:'Heebo',sans-serif; --font-body:'Assistant',sans-serif; --font-mono:'JetBrains Mono',monospace;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="light"]{
    --bg:#F1F2FA; --surface:#FFFFFF; --surface-2:#EDEFF9; --line:#D9DCEE;
    --text:#1B1930; --text-dim:#63607D; --muscle:#4A4770; --ink:#151327; --body-line:#E6E8F6;
    --shadow:0 10px 30px rgba(40,38,80,.14); --shadow-s:0 4px 14px rgba(40,38,80,.10);
    --glass:rgba(255,255,255,.9);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button,.dot,.tile,.pick-card,.kind-btn,.step,.chip{touch-action:manipulation;-webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
  body{
    background: radial-gradient(circle at 8% 0%, color-mix(in srgb, var(--pc) 14%, transparent) 0%, transparent 44%), var(--bg);
    color:var(--text); font-family:var(--font-body); min-height:100vh; min-height:100dvh;
    padding-bottom:calc(120px + var(--safe-bottom)); -webkit-text-size-adjust:100%;
    transition:background-color .3s, color .3s;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  :focus-visible{outline:2px solid var(--yellow); outline-offset:2px;}
  .wrap{max-width:540px;margin:0 auto;padding:calc(14px + var(--safe-top)) 16px 8px;}

  /* ================= animations ================= */
  @keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes popIn{0%{transform:scale(.6);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
  @keyframes shimmer{0%{background-position:-160% 0;}100%{background-position:260% 0;}}
  @keyframes rainbowSlide{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  @keyframes glowPulse{0%,100%{opacity:1;filter:none;}50%{opacity:.5;}}
  @keyframes ringWarn{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  @keyframes sheetUp{from{transform:translateY(26px);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes confetti{0%{transform:translateY(-10vh) rotate(0);opacity:1;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}
  @keyframes barGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes spinSlow{to{transform:rotate(360deg);}}
  @keyframes restPop{
    0%{transform:translateX(-50%) translateY(120%) scale(.92);opacity:0;}
    58%{transform:translateX(-50%) translateY(-9px) scale(1.035);opacity:1;}
    78%{transform:translateX(-50%) translateY(3px) scale(.995);}
    100%{transform:translateX(-50%) translateY(0) scale(1);opacity:1;}
  }
  @keyframes dialSpark{0%{transform:scale(.86);opacity:.9;}100%{transform:scale(1.5);opacity:0;}}
  @keyframes dotPop{0%{transform:scale(1);}35%{transform:scale(1.42);}70%{transform:scale(.93);}100%{transform:scale(1);}}
  @keyframes dotRing{0%{transform:scale(.7);opacity:.75;}100%{transform:scale(2.1);opacity:0;}}
  @keyframes cardFlash{0%{box-shadow:0 0 0 0 var(--dc);}100%{box-shadow:0 0 0 16px transparent;}}
  @keyframes flyUp{0%{transform:translate(-50%,0) scale(.7);opacity:0;}25%{transform:translate(-50%,-10px) scale(1.1);opacity:1;}100%{transform:translate(-50%,-46px) scale(.95);opacity:0;}}
  @keyframes toastPop{0%{transform:translateX(-50%) translateY(-16px) scale(.9);}60%{transform:translateX(-50%) translateY(2px) scale(1.03);}100%{transform:translateX(-50%) translateY(0) scale(1);}}
  @keyframes musclePop{0%{transform:scale(1);}45%{transform:scale(1.06);}100%{transform:scale(1);}}

  .anim{animation:riseIn .34s cubic-bezier(.22,.9,.3,1) both; animation-delay:calc(var(--i,0) * 42ms);}
  .screen-in{animation:fadeIn .22s ease both;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  /* ================= theme toggle ================= */
  .theme-btn{
    width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--surface);
    border:1px solid var(--line);color:var(--text);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-s);
    transition:transform .15s, background .2s;
  }
  .theme-btn:active{transform:scale(.9) rotate(-18deg);}

  /* ---------- profile picker ---------- */
  .pick{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px;max-width:460px;margin:0 auto;}
  .pick-mark{font-family:var(--font-display);font-weight:900;font-size:40px;letter-spacing:-1px;display:flex;align-items:center;gap:12px;}
  .pick-mark .badge{width:44px;height:44px;border-radius:13px;background:var(--pc);display:flex;align-items:center;justify-content:center;font-size:22px;animation:floaty 3s ease-in-out infinite;}
  .pick-q{font-size:16px;color:var(--text-dim);margin:6px 0 10px;}
  .pick-card{
    display:flex;align-items:center;gap:14px;width:100%;text-align:start;cursor:pointer;
    background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;color:var(--text);
    transition:border-color .15s,transform .1s;box-shadow:var(--shadow-s);
  }
  .pick-card:active{transform:scale(.985);}
  .pick-card .av{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:24px;color:#1a1826;flex-shrink:0;}
  .pick-card .nm{font-family:var(--font-display);font-weight:800;font-size:22px;}
  .pick-card .sb{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .pick-card .go{margin-inline-start:auto;font-size:20px;color:var(--text-dim);}
  .pick-note{font-size:12px;color:var(--text-dim);line-height:1.6;text-align:center;margin-top:8px;}

  /* ---------- home ---------- */
  .hero{padding:4px 2px 0;}
  .hero-row{display:flex;align-items:flex-start;gap:10px;}
  .hello{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:-.5px;line-height:1.2;flex:1;}
  .hello span{color:var(--pc);}
  .hero-sub{color:var(--text-dim);font-size:13.5px;margin-top:5px;}
  .rainbow-bar{height:4px;border-radius:4px;margin-top:13px;
    background:linear-gradient(90deg,var(--red),var(--blue),var(--yellow),var(--green),var(--red));
    background-size:200% 100%;animation:rainbowSlide 7s linear infinite;}

  .quote{
    margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:20px 20px 22px;display:flex;gap:14px;align-items:flex-start;position:relative;
    overflow:hidden;box-shadow:var(--shadow-s);
  }
  .quote::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3.5px;
    background:linear-gradient(180deg,var(--pc),var(--green));}
  .quote .qi{font-size:26px;line-height:1.1;animation:floaty 4s ease-in-out infinite;flex-shrink:0;}
  .quote .qt{
    flex:1;font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.4;
    letter-spacing:-.2px;text-wrap:balance;
  }
  @media (max-width:360px){ .quote{padding:17px 16px 18px;} .quote .qt{font-size:19px;} }

  .hero-stats{display:flex;gap:9px;margin-top:14px;}
  .hstat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--shadow-s);}
  .hstat .n{font-family:var(--font-mono);font-weight:700;font-size:18px;color:var(--sc,var(--text));}
  .hstat .l{font-size:10.5px;color:var(--text-dim);margin-top:3px;}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px;}
  .tile{
    position:relative;border-radius:20px;padding:15px 14px 14px;cursor:pointer;text-align:start;color:var(--text);
    background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tc);
    display:flex;flex-direction:column;gap:3px;min-height:104px;transition:transform .12s,box-shadow .2s;
    box-shadow:var(--shadow-s);overflow:hidden;
  }
  .tile::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 88% 8%, color-mix(in srgb,var(--tc) 22%,transparent), transparent 62%);pointer-events:none;}
  .tile:active{transform:scale(.97);}
  .tile .ic{font-size:24px;line-height:1;}
  .tile:active .ic{animation:popIn .3s ease;}
  .tile .t{font-family:var(--font-display);font-weight:800;font-size:16px;margin-top:6px;}
  .tile .s{font-size:11.5px;color:var(--text-dim);line-height:1.4;}
  .tile .flag{
    position:absolute;top:11px;inset-inline-end:11px;font-size:9.5px;font-weight:800;border-radius:7px;padding:2px 6px;
    background:var(--tc);color:#1a1826;z-index:1;
  }
  .tile.done .flag{background:var(--green);}
  .switch-user{margin:20px auto 6px;display:block;background:none;border:none;color:var(--text-dim);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:8px;}

  /* ---------- home: מסך אחד בדיוק, בלי גלילה ---------- */
  body.home-lock{padding-bottom:0;height:100vh;height:100dvh;overflow:hidden;}
  .wrap.home{
    height:100vh;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;
    padding-top:calc(10px + var(--safe-top));
    padding-bottom:calc(6px + var(--safe-bottom));
  }
  .wrap.home .hero{flex:0 0 auto;}
  .wrap.home .hello{font-size:clamp(21px,3.4vh,30px);}
  .wrap.home .hero-sub{font-size:clamp(11.5px,1.7vh,13.5px);margin-top:clamp(2px,.6vh,5px);}
  .wrap.home .rainbow-bar{margin-top:clamp(7px,1.5vh,13px);}
  .wrap.home .quote{
    margin-top:clamp(9px,1.8vh,16px);
    padding:clamp(11px,1.9vh,20px) clamp(14px,2vw,20px);
    gap:clamp(9px,1.4vw,14px);flex:0 0 auto;
  }
  .wrap.home .quote .qi{font-size:clamp(19px,2.9vh,26px);}
  .wrap.home .quote .qt{
    font-size:clamp(15px,2.35vh,21px);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .wrap.home .hero-stats{margin-top:clamp(8px,1.5vh,14px);flex:0 0 auto;}
  .wrap.home .hstat{padding:clamp(6px,1.2vh,10px) 8px;}
  .wrap.home .hstat .n{font-size:clamp(15px,2.1vh,18px);}
  .wrap.home .hstat .l{font-size:clamp(9px,1.3vh,10.5px);margin-top:2px;}

  .wrap.home .tiles{
    flex:1 1 auto;min-height:0;
    margin-top:clamp(9px,1.8vh,18px);
    gap:clamp(7px,1.3vh,11px);
    grid-auto-rows:1fr;                 /* כל השורות בגובה זהה וממלאות את מה שנשאר */
  }
  .wrap.home .tile{
    min-height:0;overflow:hidden;
    padding:clamp(8px,1.4vh,15px) clamp(11px,3vw,14px);
    border-radius:clamp(14px,2.2vh,20px);gap:2px;justify-content:center;
  }
  .wrap.home .tile .ic{font-size:clamp(17px,2.7vh,24px);}
  .wrap.home .tile .t{font-size:clamp(12.5px,1.95vh,16px);margin-top:clamp(2px,.7vh,6px);}
  .wrap.home .tile .s{
    font-size:clamp(9.5px,1.4vh,11.5px);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .wrap.home .switch-user{flex:0 0 auto;margin:clamp(6px,1.2vh,14px) auto 0;padding:6px 8px;}
  /* מסכים נמוכים מאוד — מוותרים על משפט היום כדי שהכל עדיין ייכנס */
  @media (max-height:560px){ .wrap.home .quote{display:none;} }

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:11px;padding:2px 0;}
  .back{
    width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .12s;box-shadow:var(--shadow-s);
  }
  .back:active{transform:translateX(4px) scale(.94);}
  .topbar h1{font-family:var(--font-display);font-weight:800;font-size:19px;margin:0;flex:1;min-width:0;}
  .topbar .sub{display:block;font-family:var(--font-body);font-weight:500;font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .topbar .pill{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 9px;white-space:nowrap;}

  .progress-bar{height:8px;border-radius:5px;background:var(--surface-2);margin-top:13px;overflow:hidden;position:relative;}
  .progress-fill{height:100%;width:0%;transition:width .4s cubic-bezier(.3,1.2,.5,1);position:relative;border-radius:5px;}
  .progress-fill::after{content:'';position:absolute;inset:0;border-radius:5px;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.45) 50%,transparent 80%);
    background-size:220% 100%;animation:shimmer 2.4s linear infinite;}
  .progress-label{color:var(--text-dim);font-size:12.5px;margin-top:6px;font-family:var(--font-mono);display:flex;justify-content:space-between;}

  /* ---------- exercise cards ---------- */
  .ex-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
  .ex-card{background:var(--surface);border-radius:16px;padding:13px;border:1px solid var(--line);position:relative;box-shadow:var(--shadow-s);transition:border-color .25s;}
  .ex-card.complete{border-color:color-mix(in srgb, var(--dc) 60%, var(--line));}
  .ex-card.complete::before{content:'';position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 10%,transparent),transparent 55%);}
  .ex-top{display:flex;gap:11px;align-items:flex-start;}
  .pictogram{flex-shrink:0;width:54px;height:96px;border-radius:12px;position:relative;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .15s;}
  .pictogram:active{transform:scale(.94);}
  .pictogram svg{width:100%;height:100%;display:block;}
  .mm{overflow:visible;}
  .mm path{stroke:var(--body-line);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;}
  .muscle-base{fill:var(--muscle);opacity:.30;}
  .muscle-sec{fill:var(--yellow);opacity:.72;}
  .muscle-hl{fill:var(--red);animation:glowPulse 2.2s ease-in-out infinite;}
  .mm .muscle-hl,.mm .muscle-sec{stroke-width:3.4;}
  .body-big .muscle-hl{filter:drop-shadow(0 0 7px color-mix(in srgb, var(--red) 55%, transparent));}
  .body-big .muscle-sec{filter:drop-shadow(0 0 5px color-mix(in srgb, var(--yellow) 45%, transparent));}
  .pictogram svg,.modal-fig svg,.heat-fig svg,.pool-fig svg{animation:musclePop .45s cubic-bezier(.3,1.3,.4,1) both;}
  .view-tag{position:absolute;top:3px;right:3px;font-family:var(--font-mono);font-size:8.5px;color:var(--text-dim);background:var(--bg);padding:1px 4px;border-radius:4px;}
  .equip-badge{position:absolute;bottom:2px;left:2px;width:19px;height:19px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .zoom-tag{position:absolute;bottom:2px;right:2px;font-size:9px;color:var(--text-dim);background:var(--bg);border-radius:4px;padding:0 3px;}
  .ex-head{flex:1;min-width:0;}
  .ex-name{font-weight:700;font-size:15px;line-height:1.3;padding-inline-end:26px;}
  .ex-meta{font-family:var(--font-mono);color:var(--dc);font-weight:700;font-size:12.5px;margin-top:3px;}
  .ex-meta small{color:var(--text-dim);font-weight:500;}
  .ex-spark{margin-top:6px;direction:ltr;}
  .ex-spark svg{display:block;}
  .ex-kill{position:absolute;top:9px;inset-inline-end:9px;width:26px;height:26px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .12s,color .15s;z-index:2;}
  .ex-kill:active{transform:scale(.85);color:var(--red);}
  .added-tag{display:inline-block;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px;
    background:color-mix(in srgb,var(--dc) 26%, transparent);color:var(--dc);margin-inline-start:6px;vertical-align:middle;}

  .coach{margin-top:9px;display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.4;border-radius:10px;padding:7px 9px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);}
  .coach b{color:var(--text);}
  .coach.up{border-color:color-mix(in srgb, var(--green) 55%, var(--line));}
  .coach.up b{color:var(--green);}
  .coach .apply{margin-inline-start:auto;background:var(--green);color:#12241d;border:none;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}

  details.cues{margin-top:9px;}
  details.cues summary{cursor:pointer;font-size:12.5px;color:var(--text-dim);list-style:none;display:flex;align-items:center;gap:5px;padding:3px 0;}
  details.cues summary::-webkit-details-marker{display:none;}
  details.cues summary::before{content:'▸';font-size:10px;transition:transform .15s;}
  details.cues[open] summary::before{transform:rotate(90deg);}
  details.cues ul{margin:6px 0 2px;padding-inline-start:18px;color:var(--text-dim);font-size:13px;line-height:1.6;animation:fadeIn .25s ease;}

  /* ---------- target + set dots ---------- */
  .ex-target{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;}
  .target-box{display:flex;align-items:baseline;gap:5px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:9px 13px;font-family:var(--font-mono);font-weight:700;cursor:pointer;
    transition:transform .12s,border-color .2s;position:relative;}
  .target-box:active{transform:scale(.96);}
  .target-box.custom{border-color:color-mix(in srgb,var(--dc) 60%,var(--line));}
  .target-box .big{font-size:22px;color:var(--dc);line-height:1;}
  .target-box .cap{font-size:10.5px;color:var(--text-dim);font-family:var(--font-body);font-weight:600;}
  .target-box .pen{font-size:11px;opacity:.65;}
  .wbox{display:flex;align-items:center;gap:6px;margin-inline-start:auto;}
  .wbox .step{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--text);font-size:19px;cursor:pointer;line-height:1;transition:transform .1s;}
  .wbox .step:active{transform:scale(.88);}
  .wbox input{width:66px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;color:var(--text);
    font-family:var(--font-mono);font-weight:700;font-size:17px;padding:8px 3px;text-align:center;}
  .wbox .unit{font-size:11px;color:var(--text-dim);}
  .bw-tag{margin-inline-start:auto;font-size:12px;color:var(--text-dim);}
  .dots{display:flex;gap:9px;margin-top:12px;align-items:center;flex-wrap:wrap;}
  .dot{width:42px;height:42px;border-radius:50%;border:2px solid var(--dc);background:transparent;color:var(--dc);
    font-family:var(--font-mono);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .18s,color .18s,transform .12s;}
  .dot:active{transform:scale(.88);}
  .dot{position:relative;}
  .wbox.bump{animation:dotPop .34s cubic-bezier(.3,1.3,.4,1);}
  .dot.on{background:var(--dc);color:#1a1826;animation:popIn .28s cubic-bezier(.3,1.4,.5,1);}
  .dot.just{animation:dotPop .5s cubic-bezier(.3,1.3,.4,1);}
  .dot.just::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--dc);
    animation:dotRing .62s ease-out both;pointer-events:none;}
  .ex-card.flash{animation:cardFlash .75s ease-out;}
  .dots-hint{font-size:11.5px;color:var(--text-dim);margin-inline-start:4px;}

  /* ---------- more-exercises button ---------- */
  .more-btn{
    margin-top:14px;width:100%;padding:15px;border-radius:16px;cursor:pointer;
    background:var(--surface);border:1.5px dashed var(--line);color:var(--text);
    font-family:var(--font-display);font-weight:800;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s,border-color .2s;
  }
  .more-btn:active{transform:scale(.98);}
  .more-btn .cnt{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--ink);
    background:var(--dc);border-radius:8px;padding:2px 7px;}

  /* ---------- sheets / modals ---------- */
  .modal{position:fixed;inset:0;background:rgba(10,9,18,.72);z-index:60;display:flex;align-items:center;
    justify-content:center;padding:calc(16px + var(--safe-top)) 14px calc(16px + var(--safe-bottom));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .2s ease;}
  html[data-theme="light"] .modal{background:rgba(30,28,60,.42);}
  .modal-box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;
    max-width:470px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    box-shadow:var(--shadow);animation:sheetUp .28s cubic-bezier(.22,.9,.3,1);}
  .modal-title{font-family:var(--font-display);font-weight:800;font-size:17px;margin-bottom:2px;}
  .modal-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5;}
  .exfig-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    padding:6px 4px 2px;margin-bottom:10px;text-align:center;}
  .exfig{width:100%;height:auto;max-height:34vh;display:block;}
  .exfig .ex-limb,.exfig .ex-torso,.exfig .ex-foot{fill:none;stroke:var(--pc);stroke-linecap:round;}
  .exfig .ex-limb{stroke-width:8;}
  .exfig .ex-torso{stroke-width:15;stroke:var(--green);}
  .exfig .ex-foot{stroke-width:6;}
  .exfig .ex-head{fill:var(--green);}
  .exfig .ex-far{opacity:.35;}
  .exfig .ex-load{fill:var(--red);}
  .exfig .ex-gear{fill:var(--line);}
  /* ---------- animated demonstrations ----------
     The source art is drawn on white and licensed at 180x180, so it is never
     scaled up: it sits at its native size on a light plate that reads as a
     deliberate window into the exercise rather than a stray white box. */
  .demo{background:linear-gradient(180deg,#FFFFFF,#EEECF6);border:1px solid var(--line);
    border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .demo-stage{display:flex;align-items:center;justify-content:center;padding:10px 8px 4px;}
  .demo-stage img{width:180px;height:180px;display:block;image-rendering:auto;
    animation:demoIn .4s cubic-bezier(.3,1.2,.4,1) both;}
  @keyframes demoIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .demo-foot{display:flex;align-items:center;gap:8px;padding:4px 11px 9px;
    font-size:10.5px;color:#6B6890;line-height:1.4;}
  .demo-foot .nm{flex:1;font-weight:700;color:#3B3960;}
  .demo-foot a{color:#6B6890;text-decoration:underline;}
  @media (prefers-reduced-motion: reduce){.demo-stage img{animation:none;}}
  .demo-alt{display:none;}
  .demo.broke .demo-stage,.demo.broke .demo-foot{display:none;}
  .demo.broke{background:var(--surface-2);}
  .demo.broke .demo-alt{display:block;}
  .demo-alt .why{font-size:11px;color:var(--text-dim);text-align:center;padding:0 10px 9px;line-height:1.5;}
  .modal-figs{display:flex;gap:10px;}
  .modal-fig{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;}
  .modal-fig svg{width:100%;height:auto;max-height:44vh;display:block;}
  .modal-fig .cap{font-size:11.5px;color:var(--text-dim);margin-top:5px;}
  .modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  /* every tag keeps the same box — same height, padding, radius and border width.
     Only the colour says whether a muscle is primary, secondary or untouched. */
  .mtag{
    display:inline-flex;align-items:center;justify-content:center;
    height:28px;padding:0 12px;border-radius:14px;box-sizing:border-box;
    font-size:12px;font-weight:700;line-height:1;white-space:nowrap;
    background:var(--surface-2);border:1.5px solid var(--line);color:var(--text-dim);
  }
  .mtag.on{background:var(--red);border-color:var(--red);color:#fff;}
  .mtag.sec{background:transparent;border-color:var(--yellow);color:var(--yellow);}
  .modal-close{margin-top:13px;width:100%;padding:13px;border-radius:13px;border:none;background:var(--surface-2);
    color:var(--text);font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;}

  /* pool list */
  .pool-group{margin-top:12px;}
  .pool-h{font-size:11.5px;color:var(--text-dim);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
  .pool-h::after{content:'';flex:1;height:1px;background:var(--line);}
  .pool-item{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:13px;padding:10px 11px;margin-bottom:7px;animation:riseIn .3s ease both;animation-delay:calc(var(--i,0)*28ms);}
  .pool-fig{width:26px;height:46px;border-radius:7px;background:var(--bg);border:1px solid var(--line);overflow:hidden;flex-shrink:0;}
  .pool-fig svg{width:100%;height:100%;display:block;}
  .pool-mid{flex:1;min-width:0;}
  .pool-nm{font-size:13.5px;font-weight:700;line-height:1.35;}
  .pool-mt{font-size:11px;color:var(--text-dim);margin-top:2px;font-family:var(--font-mono);}
  .pool-add{border:none;border-radius:10px;padding:9px 13px;font-weight:800;font-size:12.5px;cursor:pointer;
    background:var(--pc);color:var(--ink);white-space:nowrap;transition:transform .12s;}
  .pool-add:active{transform:scale(.9);}
  .pool-add.off{background:var(--surface);border:1px solid var(--line);color:var(--text-dim);}
  .pool-empty{font-size:13px;color:var(--text-dim);text-align:center;padding:16px 4px;line-height:1.6;}

  /* plan editor */
  .plan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;}
  .plan-lbl{font-size:13.5px;font-weight:700;}
  .plan-lbl small{display:block;font-weight:400;font-size:11px;color:var(--text-dim);margin-top:2px;}
  .plan-ctl{display:flex;align-items:center;gap:8px;}
  .plan-ctl button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
    color:var(--text);font-size:20px;cursor:pointer;line-height:1;transition:transform .1s;}
  .plan-ctl button:active{transform:scale(.86);}
  .plan-ctl .val{min-width:62px;text-align:center;font-family:var(--font-mono);font-weight:700;font-size:19px;color:var(--dc);}

  /* ---------- cardio ---------- */
  .kind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .kind-btn{padding:12px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);
    color:var(--text-dim);font-family:var(--font-display);font-weight:700;font-size:12.5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .15s,color .15s,border-color .15s,transform .12s;}
  .kind-btn:active{transform:scale(.94);}
  .kind-btn .ki{font-size:21px;}
  .kind-btn.active{border-color:var(--dc);background:var(--dc);color:#1a1826;}
  .kind-btn.active .ki{animation:popIn .3s ease;}
  .stage-card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow-s);}
  .stage-desc{font-size:16px;line-height:1.6;font-weight:700;}
  .stage-pace{margin-top:8px;font-size:13px;color:var(--text-dim);line-height:1.6;}
  .cardio-form{margin-top:13px;display:flex;flex-direction:column;gap:9px;}
  .cardio-field{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .cardio-field label{font-size:13.5px;color:var(--text-dim);}
  .cardio-field input{width:86px;background:transparent;border:none;color:var(--text);font-family:var(--font-mono);font-size:15px;text-align:end;}
  .cardio-field input:focus{outline:none;}
  .cardio-save{padding:14px;border-radius:13px;border:none;background:var(--dc);color:#1a1826;font-family:var(--font-display);font-weight:800;font-size:15px;cursor:pointer;transition:transform .12s;}
  .cardio-save:active{transform:scale(.97);}
  .cardio-last{margin-top:9px;font-size:12.5px;color:var(--text-dim);font-family:var(--font-mono);}
  .cardio-speed{color:var(--dc);font-weight:700;}
  .stopwatch{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:13px;padding:11px 13px;}
  .stopwatch .sw-t{font-family:var(--font-mono);font-weight:700;font-size:26px;flex:1;letter-spacing:1px;}
  .stopwatch button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;
    padding:9px 13px;font-weight:700;font-size:12.5px;cursor:pointer;}
  .stopwatch button.go{background:var(--dc);color:var(--ink);border-color:transparent;}

  /* ---------- month calendar ---------- */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px;}
  .cal-nav button{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;}
  .cal-nav button:disabled{opacity:.32;}
  .cal-title{font-family:var(--font-display);font-weight:800;font-size:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-wd{text-align:center;font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);padding-bottom:2px;}
  .cal-cell{
    aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);cursor:default;padding:2px;
    transition:transform .12s;
  }
  .cal-cell.blank{border:none;background:transparent;}
  .cal-cell.has{cursor:pointer;color:var(--text);border-color:transparent;animation:popIn .3s ease both;animation-delay:calc(var(--i,0)*14ms);}
  .cal-cell.has:active{transform:scale(.9);}
  .cal-cell.today{outline:2px solid var(--pc);outline-offset:-2px;}
  .cal-cell.sel{outline:2px solid var(--yellow);outline-offset:-2px;}
  .cal-dots{display:flex;gap:2px;}
  .cal-dots i{width:5px;height:5px;border-radius:50%;display:block;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;font-size:11.5px;color:var(--text-dim);}
  .cal-legend span{display:flex;align-items:center;gap:5px;}
  .cal-legend i{width:9px;height:9px;border-radius:50%;}
  .cal-detail{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.6;animation:riseIn .28s ease;}
  .cal-detail .d{font-family:var(--font-mono);color:var(--text-dim);font-size:11.5px;margin-bottom:4px;}
  .cal-sum{display:flex;gap:9px;margin-top:11px;}

  /* ---------- shared bits ---------- */
  .sec{margin-top:20px;}
  .sec-title{font-family:var(--font-display);font-weight:800;font-size:15px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .sec-title .hint{font-weight:500;font-size:11.5px;color:var(--text-dim);font-family:var(--font-body);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-s);}
  .heat{display:flex;gap:8px;align-items:center;justify-content:center;}
  .heat-fig{flex:1;max-width:158px;text-align:center;}
  .heat-fig svg{width:100%;height:auto;max-height:250px;}
  .heat-fig .cap{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px;}
  .heat-legend{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:10px;font-size:11px;color:var(--text-dim);}
  .heat-legend i{width:16px;height:8px;border-radius:2px;display:inline-block;}
  .heat-miss{margin-top:10px;font-size:12.5px;color:var(--text-dim);line-height:1.5;text-align:center;}
  .heat-miss b{color:var(--yellow);}
  .chart-wrap{direction:ltr;}
  .chart-wrap svg{width:100%;height:auto;display:block;}
  .chart-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:22px 6px;line-height:1.6;}
  .ex-picker{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13.5px;padding:10px;margin-bottom:10px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px;}
  .kpi{background:var(--surface-2);border-radius:11px;padding:9px 6px;text-align:center;}
  .kpi .n{font-family:var(--font-mono);font-weight:700;font-size:15.5px;}
  .kpi .l{font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .stats-row{display:flex;gap:9px;}
  .stat{flex:1;background:var(--surface);border-radius:14px;padding:11px 8px;text-align:center;border-top:3px solid var(--sc);border-inline:1px solid var(--line);border-bottom:1px solid var(--line);}
  .stat .n{font-family:var(--font-mono);font-weight:700;font-size:19px;}
  .stat .l{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .hist-list{max-height:320px;overflow-y:auto;}
  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-date{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;}
  .hist-mid{flex:1;min-width:0;}
  .hist-name{font-weight:600;}
  .hist-note{font-size:11.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-pct{font-family:var(--font-mono);font-weight:700;}
  .hist-empty{color:var(--text-dim);font-size:13px;padding:12px 0;text-align:center;line-height:1.6;}

  .log-table-wrap{max-height:330px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;}
  .log-table{width:100%;border-collapse:collapse;font-size:13px;}
  .log-sub{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);margin:12px 0 8px;text-align:center;}
  .log-table th{position:sticky;top:0;background:var(--surface-2);color:var(--text-dim);font-size:11.5px;font-weight:600;padding:8px 6px;z-index:1;}
  .log-table td{padding:4px 6px;border-top:1px solid var(--line);}
  .log-table .day-cell{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;white-space:nowrap;}
  .log-table input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font-mono);font-size:14px;text-align:center;padding:6px 2px;}
  .log-table tr.today-row td{background:color-mix(in srgb, var(--pc) 16%, transparent);}
  .log-note{margin-top:10px;font-size:12px;color:var(--text-dim);line-height:1.6;}

  details.panel{margin-top:14px;background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:2px 14px;}
  details.panel summary{cursor:pointer;padding:13px 0;font-weight:700;font-family:var(--font-display);font-size:14.5px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details.panel summary::-webkit-details-marker{display:none;}
  details.panel summary::after{content:'+';font-size:20px;color:var(--text-dim);}
  details.panel[open] summary::after{content:'–';}
  .panel-body{padding-bottom:14px;color:var(--text-dim);font-size:13.5px;line-height:1.7;animation:fadeIn .25s ease;}
  .panel-body p{margin:8px 0;}
  .panel-body b{color:var(--text);}
  .backup-area{width:100%;height:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:8px;margin-top:8px;direction:ltr;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .btn{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:transform .12s;}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--pc);color:#1a1826;border-color:transparent;}
  .btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line));}

  .sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin-top:14px;justify-content:center;}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
  .sync.ok i{background:var(--green);}
  .sync.off i{background:var(--yellow);}

  /* ---------- BIG rest timer ---------- */
  .rest-bar{
    position:fixed;bottom:calc(14px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(150%);
    width:min(430px, calc(100vw - 24px));
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1.5px solid var(--dc,var(--pc));border-radius:26px;padding:16px 16px 14px;
    box-shadow:var(--shadow);transition:transform .32s cubic-bezier(.22,.9,.3,1);z-index:55;
  }
  .rest-bar.show{transform:translateX(-50%) translateY(0);}
  .rest-bar.pop{animation:restPop .58s cubic-bezier(.2,1.05,.3,1) both;}
  .rest-dial .spark{
    position:absolute;inset:0;border-radius:50%;border:3px solid var(--dc,var(--pc));
    pointer-events:none;animation:dialSpark .7s ease-out both;
  }
  .rest-main{display:flex;align-items:center;gap:16px;}
  .rest-dial{position:relative;width:104px;height:104px;flex-shrink:0;}
  .rest-dial svg{width:104px;height:104px;display:block;transform:rotate(-90deg);}
  .rest-dial circle{fill:none;stroke-width:8;stroke-linecap:round;}
  .rest-dial .bg{stroke:var(--surface-2);}
  .rest-dial .fg{stroke:var(--dc,var(--pc));transition:stroke-dashoffset .95s linear;}
  .rest-num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:700;font-size:29px;letter-spacing:-1px;color:var(--text);
  }
  .rest-bar.low .rest-dial{animation:ringWarn 1s ease-in-out infinite;}
  .rest-bar.low .rest-dial .fg{stroke:var(--red);}
  .rest-bar.low .rest-num{color:var(--red);}
  .rest-info{flex:1;min-width:0;}
  .rest-cap{font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.25;}
  .rest-ex{font-size:12px;color:var(--text-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rest-actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}
  .rest-actions button{
    flex:1;min-width:64px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-weight:700;border-radius:12px;padding:11px 6px;font-size:13px;cursor:pointer;font-family:var(--font-body);
    transition:transform .12s;
  }
  .rest-actions button:active{transform:scale(.93);}
  .rest-actions .skip{background:var(--dc,var(--pc));color:var(--ink);border-color:transparent;}

  .toast{
    position:fixed;top:calc(14px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-16px);
    background:var(--surface-2);border:1px solid var(--line);padding:10px 17px;border-radius:20px;font-size:13px;
    color:var(--text);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:70;
    box-shadow:var(--shadow);max-width:90vw;text-align:center;font-weight:600;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);animation:toastPop .42s cubic-bezier(.2,1.2,.35,1) both;}
  .fly{

const startOfWeek = d => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; };

function LS(k, v){
  try{
    if(v===undefined) return localStorage.getItem(k);
    if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  }catch(e){ return null; }
}

/* ================= theme ================= */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const m=document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', t==='light' ? '#F1F2FA' : '#1F1D2B');
  LS('icon4me_theme', t);
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme')||'dark'; }
function toggleTheme(){
  const t = currentTheme()==='light' ? 'dark' : 'light';
  applyTheme(t);
  toast(t==='light' ? '☀️ ערכת נושא בהירה' : '🌙 ערכת נושא כהה');
}
function themeBtn(){
  return '<button class="theme-btn" data-act="theme" aria-label="החלפת ערכת נושא">'
    + (currentTheme()==='light' ? '🌙' : '☀️') + '</button>';
}
applyTheme(LS('icon4me_theme')==='light' ? 'light' : 'dark');

const cacheKey = p => 'icon4me_data_'+p;

function migrateKeys(){
  try{
    const pairs=[['icon4u_profile','icon4me_profile'],['icon4u_data_yonatan','icon4me_data_yonatan'],
                 ['icon4u_data_itamar','icon4me_data_itamar']];
    pairs.forEach(function(p){
      const old=localStorage.getItem(p[0]);
      if(old!=null && localStorage.getItem(p[1])==null) localStorage.setItem(p[1], old);
    });
  }catch(e){}
}
function loadLocal(p){
  try{ const raw = LS(cacheKey(p)); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveLocal(){ LS(cacheKey(PROFILE), JSON.stringify(state.data)); }

function normalize(d){
  const out = Object.assign(emptyData(), d||{});
  ['weights','sessions','daily','cardio'].forEach(k=>{ if(!out[k] || typeof out[k]!=='object') out[k]={}; });
  out.prefs = Object.assign(emptyPrefs(), out.prefs||{});
  ['hidden','added','plan'].forEach(k=>{ if(!out.prefs[k] || typeof out.prefs[k]!=='object') out.prefs[k]={}; });

  /* sets used to be an array indexed by position; they are now keyed by ex_key */
  Object.values(out.sessions).forEach(s=>{
    if(Array.isArray(s.sets)){
      const o={};
      s.sets.forEach((arr,i)=>{ if(arr && arr.length) o[s.day+'-'+pad2(i+1)] = arr; });
      s.sets = o;
    } else if(!s.sets || typeof s.sets!=='object') s.sets = {};
  });

  (CFG.programs||[]).filter(p=>p.type==='cardio').forEach(p=>p.kinds.forEach(k=>{
    const c = out.cardio[k.id];
    out.cardio[k.id] = {stage:(c&&+c.stage)||0, log:(c&&Array.isArray(c.log))?c.log:[]};
  }));
  return out;
}

async function pullRemote(){
  if(!SB) return null;
  const p = PROFILE;
  const [w, ws, wk, cl, cs, dl, st] = await Promise.all([
    SB.from('exercise_state').select('ex_key,current_weight').eq('profile_id',p),
    SB.from('workout_sets').select('date,program_id,ex_key,set_index,weight,reps,done').eq('profile_id',p),
    SB.from('workouts').select('date,program_id,note').eq('profile_id',p),
    SB.from('cardio_log').select('kind,date,minutes,km').eq('profile_id',p),
    SB.from('cardio_state').select('kind,stage').eq('profile_id',p),
    SB.from('daily_log').select('date,steps,body_weight').eq('profile_id',p),
    SB.from('app_settings').select('k,v').eq('profile_id',p)
  ]);
  const err = [w,ws,wk,cl,cs,dl].find(r=>r.error);
  if(err) throw err.error;

  const d = emptyData();
  (w.data||[]).forEach(r=>{ if(r.current_weight!=null) d.weights[r.ex_key]=Number(r.current_weight); });
  (wk.data||[]).forEach(r=>{
    d.sessions[r.date+'_'+r.program_id] = {day:r.program_id, date:r.date, note:r.note||'', sets:{}};
  });
  (ws.data||[]).forEach(r=>{
    const key = r.date+'_'+r.program_id;
    if(!d.sessions[key]) d.sessions[key] = {day:r.program_id, date:r.date, note:'', sets:{}};
    const S = d.sessions[key].sets;
    if(!S[r.ex_key]) S[r.ex_key]=[];
    S[r.ex_key][r.set_index] = {d:!!r.done, w:r.weight==null?null:Number(r.weight), r:r.reps==null?null:Number(r.reps)};
  });
  (cs.data||[]).forEach(r=>{ d.cardio[r.kind]=Object.assign(d.cardio[r.kind]||{log:[]},{stage:r.stage||0}); });
  (cl.data||[]).forEach(r=>{
    if(!d.cardio[r.kind]) d.cardio[r.kind]={stage:0,log:[]};
    d.cardio[r.kind].log.push({date:r.date, min:Number(r.minutes), km:r.km==null?null:Number(r.km)});
  });
  Object.values(d.cardio).forEach(c=>c.log.sort((a,b)=>a.date<b.date?-1:1));
  (dl.data||[]).forEach(r=>{ d.daily[r.date]={steps:r.steps, weight:r.body_weight==null?null:Number(r.body_weight)}; });
  if(st && !st.error) (st.data||[]).forEach(r=>{ if(r.k==='prefs' && r.v) d.prefs = Object.assign(emptyPrefs(), r.v); });
  return d;
}

async function pushSession(sess){
  if(!SB) return;
  const rows = [];
  Object.keys(sess.sets||{}).forEach(k=>{
    (sess.sets[k]||[]).forEach((c,j)=>{
      if(!c) return;
      rows.push({profile_id:PROFILE, date:sess.date, program_id:sess.day, ex_key:k,
                 set_index:j, weight:c.w, reps:c.r, done:!!c.d});
    });
  });
  await SB.from('workouts').upsert({profile_id:PROFILE, date:sess.date, program_id:sess.day, note:sess.note||''},
    {onConflict:'profile_id,date,program_id'});
  if(rows.length) await SB.from('workout_sets').upsert(rows, {onConflict:'profile_id,date,program_id,ex_key,set_index'});
}
async function pushWeight(key, val){
  if(!SB) return;
  await SB.from('exercise_state').upsert({profile_id:PROFILE, ex_key:key, current_weight:val, updated_at:new Date().toISOString()},
    {onConflict:'profile_id,ex_key'});
}
async function pushDaily(date){
  if(!SB) return;
  const e = state.data.daily[date]||{};
  await SB.from('daily_log').upsert({profile_id:PROFILE, date, steps:e.steps==null?null:e.steps, body_weight:e.weight==null?null:e.weight},
    {onConflict:'profile_id,date'});
}
async function pushCardio(kind, entry){
  if(!SB) return;
  await SB.from('cardio_log').insert({profile_id:PROFILE, kind, date:entry.date, minutes:entry.min, km:entry.km});
  await SB.from('cardio_state').upsert({profile_id:PROFILE, kind, stage:state.data.cardio[kind].stage||0},
    {onConflict:'profile_id,kind'});
}
async function pushPrefs(){
  if(!SB) return;
  await SB.from('app_settings').upsert({profile_id:PROFILE, k:'prefs', v:state.data.prefs, updated_at:new Date().toISOString()},
    {onConflict:'profile_id,k'});
}
async function pushAll(){
  if(!SB) return;
  for(const s of Object.values(state.data.sessions)) await pushSession(s);
  for(const k of Object.keys(state.data.weights)) await pushWeight(k, state.data.weights[k]);
  for(const d of Object.keys(state.data.daily)) await pushDaily(d);
  await pushPrefs();
}

/* queue of remote writes so the UI never blocks on the network */
const queue = [];
let flushing = false;
function enqueue(fn){
  if(!SB) return;
  queue.push(fn);
  if(!flushing) flush();
}
async function flush(){
  flushing = true;
  while(queue.length){
    const fn = queue.shift();
    try{ await fn(); setSync('ok'); }
    catch(e){ setSync('off'); }
  }
  flushing = false;
}
function setSync(s){
  if(state.sync===s) return;
  state.sync=s;
  const el=document.getElementById('syncDot');
  if(el){ el.className='sync '+s; el.querySelector('span').textContent = syncText(s); }
}
function syncText(s){
  if(s==='ok') return 'מסונכרן עם הענן';
  if(s==='off') return 'הענן לא זמין כרגע';
  return '';
}
function persist(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>toast('נשמר ✓'), 400);
}
function persistPrefs(){ persist(); enqueue(pushPrefs); }

/* ================= program & exercise access ================= */
function progOf(id){
  return (CFG.programs.find(p=>p.id===id)) || LEGACY_PROGRAMS[id] || CFG.programs[0];
}
const rawEx = id => { const p=CFG.programs.find(x=>x.id===id); return (p && p.ex) || []; };
const poolOf = id => { const p=CFG.programs.find(x=>x.id===id); return (p && p.pool) || []; };
const prefs = () => (state.data && state.data.prefs) || emptyPrefs();

function withPlan(e){
  const pl = prefs().plan[e.k];
  if(!pl) return e;
  const o = Object.assign({}, e);
  if(pl.s) o.sets = pl.s;
  if(pl.r!=null) o.reps = pl.r;
  o.custom = true;
  return o;
}
/* the live list for a program: base minus deleted, plus whatever was added */
function exOf(id){
  const base = rawEx(id), pool = poolOf(id);
  if(!base.length && !pool.length) return [];
  const hid = prefs().hidden, added = prefs().added[id] || [];
  const list = base.filter(e=>!hid[e.k])
    .concat(added.map(k=>pool.filter(e=>e.k===k)[0]).filter(Boolean).filter(e=>!hid[e.k])
      .map(e=>Object.assign({}, e, {added:true})));
  return list.map(withPlan);
}
function exByKey(id, k){ return exOf(id).filter(e=>e.k===k)[0] || null; }
function anyExByKey(k){
  for(const p of CFG.programs){
    const f = (p.ex||[]).concat(p.pool||[]).filter(e=>e.k===k)[0];
    if(f) return withPlan(f);
  }
  return null;
}
const isTime = reps => typeof reps==='string' && /שנ|דק/.test(reps);
const timeSecs = reps => { const m=String(reps).match(/(\d+)/); const n=m?+m[1]:0; return /דק/.test(reps)? n*60 : n; };

function getSession(dayId, create){
  const date = todayISO(), key = date+'_'+dayId;
  let s = state.data.sessions[key];
  if(!s){
    s = {day:dayId, date, sets:{}, note:''};
    if(create) state.data.sessions[key] = s;
  }
  ensureSets(s);
  return s;
}
function ensureSets(s){
  if(!s.sets || typeof s.sets!=='object' || Array.isArray(s.sets)) s.sets={};
  exOf(s.day).forEach(e=>{
    if(!Array.isArray(s.sets[e.k])) s.sets[e.k]=[];
    for(let j=0;j<e.sets;j++) if(!s.sets[e.k][j]) s.sets[e.k][j]={d:false,w:null,r:null};
  });
}
/* every session that recorded a completed set of this exercise, newest first */
function exHistory(k, excludeDate){
  return Object.values(state.data.sessions)
    .filter(s=>s.date!==excludeDate && s.sets && s.sets[k] && s.sets[k].some(x=>x&&x.d))
    .sort((a,b)=> a.date<b.date?1:-1);
}
function workingWeight(k){ return state.data.weights[k]!=null ? state.data.weights[k] : null; }
function setWorkingWeight(k, val){
  if(val==null || val==='' || isNaN(val)) delete state.data.weights[k];
  else state.data.weights[k] = Number(val);
  persist();
  enqueue(()=>pushWeight(k, state.data.weights[k]==null?null:state.data.weights[k]));
}

/* ================= math ================= */
const e1rm = (w,r) => (w>0 && r>0) ? w*(1+r/30) : 0;
const setsDone = s => Object.values(s.sets||{}).reduce((a,arr)=>a+(arr||[]).filter(x=>x&&x.d).length,0);
const setsTotal = dayId => exOf(dayId).reduce((a,e)=>a+e.sets,0);
const volumeOf = s => Object.values(s.sets||{}).reduce((a,arr)=>a+(arr||[]).reduce((b,x)=>b+(x&&x.d?(x.w||0)*(x.r||0):0),0),0);
/* total that also respects sets recorded for exercises that were since removed */
function sessionTotal(s){
  const active = exOf(s.day); let t=0; const seen={};
  active.forEach(e=>{ seen[e.k]=1; t += Math.max(e.sets, ((s.sets||{})[e.k]||[]).length); });
  Object.keys(s.sets||{}).forEach(k=>{ if(!seen[k]) t += (s.sets[k]||[]).filter(x=>x&&x.d).length; });
  return t;
}
function sessionPct(s){ const t=sessionTotal(s); return t?Math.min(100,Math.round(setsDone(s)/t*100)):0; }
const sessionDone = s => sessionPct(s)>=80;

function bestE1RM(k, beforeDate){
  let best=0, bw=0;
  Object.values(state.data.sessions).forEach(s=>{
    if(beforeDate && s.date>=beforeDate) return;
    ((s.sets||{})[k]||[]).forEach(x=>{ if(x&&x.d){ const e=e1rm(x.w,x.r); if(e>best){best=e;bw=x.w;} } });
  });
  return {e:best, w:bw};
}
function lastRepsFor(k, setIdx){
  for(const s of exHistory(k, todayISO())){
    const arr=(s.sets||{})[k]||[];
    if(arr[setIdx] && arr[setIdx].d && arr[setIdx].r!=null) return arr[setIdx].r;
    const any=arr.filter(x=>x&&x.d&&x.r!=null);
    if(any.length) return any[any.length-1].r;
  }
  return null;
}
function coachFor(exo){
  if(!exo) return null;
  const target = typeof exo.reps==='number' ? exo.reps : null;
  const hist = exHistory(exo.k, todayISO()).slice(0,2)
    .map(s=>((s.sets||{})[exo.k]||[]).filter(x=>x&&x.d)).filter(a=>a.length);
  if(!hist.length) return {type:'first'};
  const ok = arr => arr.length>=exo.sets && (!target || arr.every(x=>(x.r||0)>=target));
  const topW = arr => Math.max(0, ...arr.map(x=>x.w||0));
  const lastOK = ok(hist[0]), prevOK = hist[1]?ok(hist[1]):false;
  const w = topW(hist[0]);
  if(!exo.w) return (lastOK&&prevOK) ? {type:'up', reps:(target||0)+2, bw:true} : {type:'hold', bw:true};
  if(!w) return {type:'hold'};
  if(lastOK&&prevOK) return {type:'up', from:w, to:r05(w+(exo.inc||2.5))};
  if(lastOK) return {type:'almost', from:w};
  return {type:'hold', from:w};
}

function sessionsOn(dateStr){ return Object.values(state.data.sessions).filter(s=>s.date===dateStr && setsDone(s)>0); }
function cardioOn(dateStr){
  const out=[];
  Object.keys(state.data.cardio).forEach(k=>(state.data.cardio[k].log||[]).forEach(l=>{ if(l.date===dateStr) out.push(Object.assign({kind:k},l)); }));
  return out;
}
const activeOn = d => sessionsOn(d).length>0 || cardioOn(d).length>0;
function last7(){ const a=[]; for(let i=6;i>=0;i--) a.push(dISO(addDays(new Date(),-i))); return a; }
function weekCount(){ const ws=startOfWeek(new Date()); let c=0; for(let i=0;i<7;i++){ const d=addDays(ws,i); if(d>new Date()) break; if(activeOn(dISO(d))) c++; } return c; }
function activeDaysIn(ws){ let c=0; for(let i=0;i<7;i++) if(activeOn(dISO(addDays(ws,i)))) c++; return c; }
function earliestDate(){
  const ds = Object.values(state.data.sessions).map(s=>s.date)
    .concat(...Object.values(state.data.cardio).map(k=>(k.log||[]).map(l=>l.date)));
  return ds.length ? ds.sort()[0] : null;
}
function weekStreak(){
  const f = earliestDate(); if(!f) return 0;
  const fws = startOfWeek(parseISO(f));
  let ws=startOfWeek(new Date()), streak=0, cur=true, g=0;
  while(ws>=fws && g++<200){
    if(activeDaysIn(ws)>=CFG.weekGoal) streak++;
    else if(!cur) break;
    cur=false; ws=addDays(ws,-7);
  }
  return streak;
}
function totalWorkouts(){
  return Object.values(state.data.sessions).filter(sessionDone).length
       + Object.values(state.data.cardio).reduce((a,k)=>a+(k.log||[]).length,0);
}
function lastActiveDate(){
  const ds = Object.values(state.data.sessions).filter(s=>setsDone(s)>0).map(s=>s.date)
    .concat(...Object.values(state.data.cardio).map(k=>(k.log||[]).map(l=>l.date)));
  return ds.length ? ds.sort().reverse()[0] : null;
}
function heatMap(){
  const days=last7(), m={};
  Object.values(state.data.sessions).forEach(s=>{
    if(days.indexOf(s.date)<0) return;
    Object.keys(s.sets||{}).forEach(k=>{
      const n=(s.sets[k]||[]).filter(x=>x&&x.d).length;
      if(!n) return;
      const e = anyExByKey(k); if(!e) return;
      (e.hl||[]).forEach(x=>m[x]=(m[x]||0)+n);
      (e.hl2||[]).forEach(x=>m[x]=(m[x]||0)+n*0.5);
    });
  });
  return m;
}
function e1rmSeries(k){
  return exHistory(k,null).slice().reverse().map(s=>{
    const arr=((s.sets||{})[k]||[]).filter(x=>x&&x.d);
    const b=Math.max(0,...arr.map(x=>e1rm(x.w,x.r)));
    return b>0?{x:s.date, y:Math.round(b*10)/10, label:s.date.slice(5).replace('-','/')}:null;
  }).filter(Boolean);
}

/* ================= body map ================= */
function attr(o){ return Object.entries(o).map(([k,v])=>k+'="'+v+'"').join(' '); }
function heatStyle(c){
  if(!c) return 'fill="var(--muscle)" opacity=".13"';
  if(c<=3) return 'fill="var(--pc)" opacity=".32"';
  if(c<=7) return 'fill="var(--pc)" opacity=".62"';
  if(c<=13) return 'fill="var(--pc)" opacity=".85"';
  return 'fill="var(--green)" opacity="1"';
}
/* ---- anatomical body map ----
   Path data adapted from MuscleMap by Melih Colpan (MIT licence),
   https://github.com/melihcolpan/MuscleMap — front and back male figures.

    + 'xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'

function lineChart(pts,o){
  o=o||{};
  const W=320,H=o.h||120,L=34,R=8,T=12,B=20;
  if(pts.length<2) return '<div class="chart-empty">'+(o.empty||'צריך לפחות שתי מדידות כדי לצייר גרף.')+'</div>';
  const ys=pts.map(p=>p.y);
  let min=Math.min(...ys), max=Math.max(...ys);
  if(max===min){ max=min+1; min=Math.max(0,min-1); }
  const X=i=>L+i*(W-L-R)/(pts.length-1), Y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+' L '+X(pts.length-1).toFixed(1)+' '+(H-B)+' L '+X(0).toFixed(1)+' '+(H-B)+' Z';
  const c=o.color||'var(--pc)', gid='g'+Math.random().toString(36).slice(2,7);
  const len=(W-L-R)*1.4;
  const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===pts.length-1?3.6:2)+'" fill="'+c+'"/>').join('');
  const fmt=o.fmt||(v=>Math.round(v));
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".3"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient></defs>'
    +'<line x1="'+L+'" y1="'+T+'" x2="'+(W-R)+'" y2="'+T+'" stroke="var(--line)" stroke-dasharray="2 4"/>'
    +'<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--line)"/>'
    +'<text x="'+(L-5)+'" y="'+(T+4)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">'+fmt(max)+'</text>'
    +'<text x="'+(L-5)+'" y="'+(H-B)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">'+fmt(min)+'</text>'
    +'<path d="'+area+'" fill="url(#'+gid+')"><animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze"/></path>'
    +'<path d="'+line+'" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" '
    +'stroke-dasharray="'+len.toFixed(0)+'" stroke-dashoffset="'+len.toFixed(0)+'">'
    +'<animate attributeName="stroke-dashoffset" from="'+len.toFixed(0)+'" to="0" dur=".85s" fill="freeze"/></path>'

    +'<text x="'+X(0).toFixed(1)+'" y="'+(H-6)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="start">'+esc(pts[0].label||'')+'</text>'
    +'<text x="'+X(pts.length-1).toFixed(1)+'" y="'+(H-6)+'" fill="var(--text-dim)" font-size="9" font-family="JetBrains Mono, monospace" text-anchor="end">'+esc(pts[pts.length-1].label||'')+'</text>'
    +'</svg></div>';
}
function sparkline(pts,c){
  if(pts.length<2) return '';

  let min=Math.min(...ys), max=Math.max(...ys);

    +'<circle cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(pts[pts.length-1].y).toFixed(1)+'" r="2.6" fill="'+(up?'var(--green)':c)+'"><animate attributeName="r" values="2.6;4;2.6" dur="2s" repeatCount="indefinite"/></circle></svg>';

function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    [0,160,320].forEach(t=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=880;
      const at=audioCtx.currentTime+t/1000;
      g.gain.setValueAtTime(.0001,at);
      g.gain.exponentialRampToValueAtTime(.22,at+.02);
      g.gain.exponentialRampToValueAtTime(.0001,at+.16);
      o.connect(g); g.connect(audioCtx.destination); o.start(at); o.stop(at+.2);
    });
  }catch(e){}
}
/* ---------- haptics ----------

function paintRest(){

  const ring=document.getElementById('restRing'), C=2*Math.PI*45;
  ring.setAttribute('stroke-dasharray',C.toFixed(1));
  ring.setAttribute('stroke-dashoffset',(C*(1-restLeft/Math.max(1,restTotal))).toFixed(1));
  bar.classList.toggle('low', restLeft<=5);
}
function stopRest(){
  clearInterval(restInt); restInt=null;
  const b=document.getElementById('restBar');

  const sp=b.querySelector('.spark'); if(sp) sp.remove();
}
function startRest(sec, cap, exName){
  clearInterval(restInt); restLeft=sec; restTotal=sec;
  const bar=document.getElementById('restBar');
  document.getElementById('restCap').textContent = cap||'מנוחה בין סטים';
  document.getElementById('restEx').textContent = exName||'';
  if(state.day){ const p=progOf(state.day); bar.style.setProperty('--dc', p.hex||'var(--pc)'); }
  bar.classList.remove('low');
  bar.classList.add('show'); paintRest();
  if(!reduced()){
    bar.classList.remove('pop'); void bar.offsetWidth; bar.classList.add('pop');
    const dial=bar.querySelector('.rest-dial');
    if(dial){
      const old=dial.querySelector('.spark'); if(old) old.remove();

function restSecs(exo){

  s.className='fly'; s.textContent=txt;
  s.style.left=(r.left+r.width/2)+'px';
  s.style.top=(r.top-4)+'px';

function celebrate(){
  if(reduced()) return;

  const cols=['#FF4D6D','#3DA9FC','#FFD23F','#2FE6A7','#5EE7FF','#FF7EB6'];
  for(let i=0;i<44;i++){
    const s=document.createElement('i');
    s.style.left=(Math.random()*100)+'vw';
    s.style.background=cols[i%cols.length];

    s.style.animationDelay=(Math.random()*.5)+'s';
    s.style.transform='rotate('+(Math.random()*360)+'deg)';
    box.appendChild(s);
  }

    const to=+el.dataset.count, suf=el.dataset.suf||'';
    if(!isFinite(to) || to<=0) return;
    const t0=performance.now(), dur=650;
    (function step(t){
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent = Math.round(to*e)+suf;
      if(k<1) requestAnimationFrame(step);
    })(t0);
  });
}

/* ================= actions ================= */
function suggestDay(){
  const st = CFG.programs.filter(p=>p.type==='strength');
  if(st.length<2) return st.length?st[0].id:CFG.programs[0].id;
  const today=todayISO();
  const done = st.filter(p=>{ const s=state.data.sessions[today+'_'+p.id]; return s&&setsDone(s)>0; })[0];
  if(done) return done.id;
  const last = Object.values(state.data.sessions).filter(s=>setsDone(s)>0).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!last) return st[0].id;
  const i = st.findIndex(p=>p.id===last.day);
  return i<0 ? st[0].id : st[(i+1)%st.length].id;
}
/* Repaint only what a ticked set actually changes, so the screen doesn't
   rebuild itself under the finger. Returns false if a full render is needed. */
function patchWorkout(k){
  if(state.screen!=='workout' || state.modal) return false;
  const card=app.querySelector('[data-card="'+k+'"]'); if(!card) return false;
  const s=getSession(state.day,false), exo=exByKey(state.day,k);
  const arr=s.sets[k]||[], dots=card.querySelectorAll('.dot');
  if(dots.length!==arr.length) return false;
  const prog=progOf(state.day);

  arr.forEach(function(cell,j){
    const b=dots[j], was=b.classList.contains('on'), now=!!cell.d;
    b.classList.toggle('on',now);
    b.textContent = now ? '\u2713' : String(j+1);
    b.setAttribute('aria-pressed', String(now));
    if(now && !was){
      b.classList.remove('just'); void b.offsetWidth; b.classList.add('just');
      flyBadge(b, '+1', prog.hex);
    } else if(!now){ b.classList.remove('just'); }
  });

  const wasDone=card.classList.contains('complete');
  const allDone=!!(arr.length && arr.every(function(x){return x.d;}));
  card.classList.toggle('complete',allDone);
  if(allDone && !wasDone && !reduced()){
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  }
  const hint=card.querySelector('.dots-hint');
  if(hint) hint.textContent = allDone ? '\u05d4\u05d5\u05e9\u05dc\u05dd \u2713' : '\u05dc\u05d7\u05d9\u05e6\u05d4 = \u05e1\u05d8 \u05e9\u05e1\u05d9\u05d9\u05de\u05ea';
  const sp=card.querySelector('.ex-spark');
  if(sp && exo && exo.w) sp.innerHTML=sparkline(e1rmSeries(k),prog.hex);

  const total=sessionTotal(s), done=setsDone(s), pct=sessionPct(s), vol=Math.round(volumeOf(s));
  const fill=app.querySelector('.progress-fill'); if(fill) fill.style.width=pct+'%';
  const lab=app.querySelectorAll('.progress-label span');
  if(lab.length){
    lab[0].textContent = done+' / '+total+' \u05e1\u05d8\u05d9\u05dd';
    if(lab[1]) lab[1].textContent = vol ? num(vol)+' \u05e7\u05f4\u05d2 \u05e0\u05e4\u05d7' : '';
  }
  return true;
}
function toggleSet(k, setIdx){
  const s=getSession(state.day,true), exo=exByKey(state.day,k);
  if(!exo || !s.sets[k]) return;
  const cell=s.sets[k][setIdx]; if(!cell) return;
  const before=sessionPct(s);
  if(cell.d){ cell.d=false; }
  else{
    if(cell.w==null && exo.w) cell.w = workingWeight(k);
    if(cell.r==null){
      const lr = lastRepsFor(k,setIdx);
      cell.r = lr!=null ? lr : (typeof exo.reps==='number'?exo.reps:null);
    }
    const best=bestE1RM(k,todayISO());
    cell.d=true;
    if(exo.w && best.e>0 && e1rm(cell.w,cell.r)>best.e*1.005) toast('🏆 שיא אישי ב'+exo.n.split('(')[0].trim());
    const rs=restSecs(exo); if(rs) startRest(rs, 'מנוחה בין סטים', exo.n);
  }
  haptic(!cell.d ? 'undo' : ((s.sets[k]||[]).every(x=>x.d) ? 'done' : 'tick'));
  persist(); enqueue(()=>pushSession(s));
  const after=sessionPct(s), ck=s.date+'_'+s.day;
  if(before<100 && after>=100 && !state.celebrated[ck]){ state.celebrated[ck]=1; celebrate(); toast('🎉 סיימת את כל הסטים!'); }
  /* the summary card shows up at 80% — only then is a full rebuild needed */
  const crossed = (before>=80) !== (after>=80);
  if(crossed || !patchWorkout(k)) render();
}
function bumpWeight(k, delta){
  const exo=exByKey(state.day,k); if(!exo) return;
  const cur=workingWeight(k);
  const next=Math.max(0, r05((cur==null?0:cur) + delta*(exo.inc||2.5)));
  applyWeight(k,next);
}
function applyWeight(k,val){
  setWorkingWeight(k,val);
  const s=getSession(state.day,true);
  (s.sets[k]||[]).forEach(c=>{ if(!c.d) c.w = (val===''||val==null)?null:Number(val); });
  enqueue(()=>pushSession(s));
  /* just update the number in place — no reason to rebuild the screen */
  const box=app.querySelector('[data-k="ww-'+k+'"]');
  if(box && state.screen==='workout' && !state.modal){
    box.value=(val===''||val==null)?'':val;
    const w=box.closest('.wbox');
    if(w && !reduced()){ w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump'); }
  } else render();
}
function removeExercise(k){
  const exo = exByKey(state.day,k) || anyExByKey(k);
  const nm = exo ? exo.n.split('(')[0].trim() : 'התרגיל';
  if(!confirm('להוריד את "'+nm+'" מהאימון?\n\nההיסטוריה נשמרת, ואפשר להחזיר אותו בכל רגע מ"עוד תרגילים" בתחתית המסך.')) return;
  prefs().hidden[k] = true;
  const added = prefs().added[state.day];
  if(added){ const i=added.indexOf(k); if(i>=0) added.splice(i,1); }
  persistPrefs(); render(); toast('הוסר ✓');
}
function addExercise(k){
  delete prefs().hidden[k];
  const pool = poolOf(state.day);
  if(pool.some(e=>e.k===k)){
    if(!prefs().added[state.day]) prefs().added[state.day]=[];
    if(prefs().added[state.day].indexOf(k)<0) prefs().added[state.day].push(k);
  }
  persistPrefs();
  const s=state.data.sessions[todayISO()+'_'+state.day];
  if(s) ensureSets(s);
  render(); toast('נוסף לאימון ✓');
}
function changePlan(k, field, delta){
  const base = (rawEx(state.day).concat(poolOf(state.day))).filter(e=>e.k===k)[0];
  if(!base) return;
  const cur = prefs().plan[k] || {};
  const nowSets = cur.s || base.sets;
  const nowReps = cur.r!=null ? cur.r : base.reps;
  let s=nowSets, r=nowReps;
  if(field==='s') s = Math.max(1, Math.min(10, nowSets + delta));
  else{
    if(isTime(base.reps)){
      const unit = /לצד/.test(String(nowReps)) ? ' שנ׳ לצד' : ' שנ׳';
      const sec = Math.max(10, Math.min(300, timeSecs(nowReps) + delta*5));
      r = sec + unit;
    } else if(typeof nowReps==='string'){
      const m=String(nowReps).match(/(\d+)/);
      const n=Math.max(1, Math.min(50, (m?+m[1]:8) + delta));
      r = String(nowReps).replace(/\d+/, String(n));
    } else {
      r = Math.max(1, Math.min(50, (+nowReps||8) + delta));
    }
  }
  prefs().plan[k] = {s:s, r:r};
  /* keep today's card in sync with the new number of sets */
  const sess=state.data.sessions[todayISO()+'_'+state.day];
  if(sess && Array.isArray(sess.sets[k])){
    while(sess.sets[k].length > s && !sess.sets[k][sess.sets[k].length-1].d) sess.sets[k].pop();
    ensureSets(sess);
  }
  persistPrefs(); render();
}
function resetPlan(k){ delete prefs().plan[k]; persistPrefs(); render(); toast('חזר לברירת המחדל'); }

function saveCardio(){
  const kind=state.kind;
  const minEl=document.getElementById('cMin'), kmEl=document.getElementById('cKm');
  const min=Number(minEl.value);
  if(!min||min<=0){ minEl.focus(); toast('כמה דקות עשית?'); return; }
  if(!state.data.cardio[kind]) state.data.cardio[kind]={stage:0,log:[]};
  const c=state.data.cardio[kind];
  const entry={date:todayISO(), min, km:(kmEl&&kmEl.value)?Number(kmEl.value):null};
  c.log.push(entry);

function stopWatch(cmd){
  if(cmd==='toggle'){
    swOn=!swOn;
    if(swOn){ swInt=setInterval(()=>{ swSec++; paintSW(); },1000); }
    else clearInterval(swInt);
  } else if(cmd==='reset'){ clearInterval(swInt); swOn=false; swSec=0; }
  else if(cmd==='use'){
    const el=document.getElementById('cMin');
    if(el){ el.value = Math.max(1, Math.round(swSec/60)); toast('הזמן הועתק לשדה'); }
    return;
  }
  render();
}
function paintSW(){
  const el=document.getElementById('swT');
  if(el) el.textContent = pad2(Math.floor(swSec/3600))+':'+pad2(Math.floor(swSec/60)%60)+':'+pad2(swSec%60);
}
function updateDaily(date,field,val){
  if(!state.data.daily[date]) state.data.daily[date]={};
  state.data.daily[date][field]= val===''?null:Number(val);
  persist(); enqueue(()=>pushDaily(date));

let modalPushed=false;
function navSnap(){
  return {screen:state.screen, day:state.day, kind:state.kind, calY:state.calY, calM:state.calM,
          calSel:state.calSel, modal:state.modal};
}
function go(screen,opts,replace){
  Object.assign(state,{screen}, opts||{});
  modalPushed=false;
  try{
    if(replace) history.replaceState(navSnap(),'');
    else history.pushState(navSnap(),'');
  }catch(e){}
  render();
  window.scrollTo(0,0);
}
function goBack(){
  if(state.modal){
    const pushed = modalPushed;
    state.modal=null; modalPushed=false; render();
    if(pushed){ try{ history.back(); }catch(e){} }
    return;
  }
  stopRest();
  if(history.state && history.state.screen && history.state.screen!=='home'){ history.back(); return; }
  if(state.screen!=='home'){ go('home',null,true); }
}
function closeModal(){
  state.modal=null; modalPushed=false;
  try{ history.replaceState(navSnap(),''); }catch(e){}
}
function openModal(m){
  state.modal=m;
  try{ history.pushState(navSnap(),''); modalPushed=true; }catch(e){ modalPushed=false; }
  render();
}
window.addEventListener('popstate', function(e){
  const s=e.state;
  if(s && s.screen){
    const moved = (s.screen !== state.screen);
    if(!s.modal) stopRest();
    state.modal = s.modal || null;
    modalPushed = !!s.modal;
    Object.assign(state,s);
    render();
    if(!s.modal && moved) window.scrollTo(0,0);
  } else if(PROFILE){ state.modal=null; modalPushed=false; state.screen='home'; render(); }
});

    summary='<div class="card anim" style="margin-top:14px;border-color:'+prog.hex+'">'
      +'<div class="sec-title" style="margin-bottom:6px">✅ סיימת את '+esc(prog.label)+'</div>'
      +'<div class="kpis"><div class="kpi"><div class="n">'+num(vol)+'</div><div class="l">ק״ג הורמו</div></div>'
      +'<div class="kpi"><div class="n">'+done+'</div><div class="l">סטים</div></div>'
      +'<div class="kpi"><div class="n" style="color:'+(diff!=null&&diff>=0?'var(--green)':'var(--text)')+'">'+(diff!=null?(diff>0?'+':'')+diff+'%':'—')+'</div><div class="l">מול הפעם הקודמת</div></div></div></div>';
  }

  const empty = ex.length ? '' :
    '<div class="card" style="margin-top:14px;text-align:center;color:var(--text-dim);line-height:1.7">'
    +'האימון הזה ריק כרגע.<br>אפשר להוסיף תרגילים מהכפתור למטה.</div>';

  return '<div class="wrap screen-in">'+topbar(prog.label, prog.sub||'', s.date)
    +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+prog.hex+'"></div></div>'
    +'<div class="progress-label"><span>'+done+' / '+total+' סטים</span><span>'+(vol?num(vol)+' ק״ג נפח':'')+'</span></div>'
    +'<div class="ex-list">'+cards+'</div>'+empty+moreBtn
    +'<div class="note-row" style="margin-top:12px"><input type="text" data-k="note" value="'+esc(s.note||'')+'" placeholder="הערה לאימון של היום" style="width:100%;background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--text);font-size:14px;padding:7px 2px"></div>'
    +summary+'</div>';
}

/* pool = exercises not currently in the workout (spare pool + deleted base) */
function availablePool(dayId){
  const active = exOf(dayId).map(e=>e.k);
  const hid = prefs().hidden;
  const out = [];
  rawEx(dayId).forEach(e=>{ if(hid[e.k]) out.push(Object.assign({},e,{restore:true})); });
  poolOf(dayId).forEach(e=>{ if(active.indexOf(e.k)<0) out.push(Object.assign({},e,{restore:!!hid[e.k]})); });
  return out;
}

    +'<div class="pool-group"><div class="pool-h">אפשר להוסיף</div>'+listAdd+'</div>'

/* ---- animated demonstration -------------------------------------------
   One looping animation per exercise, taken from the exercises-dataset build
   of the Gym visual library. The media is licensed for redistribution at
   180x180 and only on the condition that the copyright line travels with it,
   so the credit below is part of the component, not decoration — do not strip
   it and do not upscale the frames.
   Five movements have no match in that library (hollow hold, bird dog,
   superman, wall sit); those still fall back to the drawn figure. */
const DEMO_KEYS = ["core-01","core-02","core-03","core-04","core-05","core-p1","core-p2","core-p3","core-p6","home-01","home-02","home-03","home-04","home-06","home-07","home-p1","home-p2","home-p4","home-p5","home-p6","home-p7","home-p8","lower-01","lower-02","lower-03","lower-04","lower-05","lower-06","lower-p1","lower-p2","lower-p3","lower-p4","lower-p5","lower-p6","lower-p7","lower-p8","upper-01","upper-02","upper-03","upper-04","upper-05","upper-06","upper-07","upper-08","upper-p1","upper-p10","upper-p11","upper-p2","upper-p3","upper-p4","upper-p5","upper-p6","upper-p7","upper-p8","upper-p9"];
const DEMO_SET = DEMO_KEYS.reduce(function(o,k){ o[k]=1; return o; }, {});
const DEMO_CREDIT = '\u00A9 Gym visual';

function exDemo(k){
  const fig = exFigSVG(k);
  const drawn = fig ? '<div class="exfig-wrap">'+fig+'</div>' : '';
  if(!DEMO_SET[k]) return drawn;
  /* If demos/ never made it onto the server the <img> would sit there as a
     broken-image box. Fall back to the drawn figure instead, and say why —
     a silent fallback would look like the animation was simply never added. */
  return '<div class="demo">'
    + '<div class="demo-stage"><img src="'+k+'.gif" width="180" height="180" '
    + 'decoding="async" alt="הדגמת התרגיל" onerror="demoFail(this)"></div>'
    + '<div class="demo-foot"><span class="nm">הדגמה</span>'
    + '<span>'+DEMO_CREDIT+' — <a href="https://gymvisual.com/" target="_blank" rel="noopener">gymvisual.com</a></span>'
    + '</div>'
    + '<div class="demo-alt">'+drawn
    + '<div class="why">האנימציה לא נטענה — קובץ <code>'+k+'.gif</code> חסר באותה תיקייה כמו index.html.</div>'
    + '</div></div>';
}
window.demoFail = function(img){
  const box = img.closest('.demo');
  if(box) box.classList.add('broke');
};

/* Pull every animation through the service-worker cache while there is signal.
   5MB once, and then the sheets open instantly in the corner of the gym where
   the phone drops to one bar. */
function prefetchDemos(){
  if(navigator.onLine === false) return;
  let i = 0;
  (function next(){
    if(i >= DEMO_KEYS.length) return;
    const u = DEMO_KEYS[i++]+'.gif';
    try{ fetch(u).then(next).catch(next); }catch(e){ next(); }
  })();
}

/* ================= screen: progress ================= */
function monthCalendar(){
  const y=state.calY, m=state.calM, today=todayISO();
  const first=new Date(y,m,1), daysIn=new Date(y,m+1,0).getDate();
  const lead=first.getDay();
  const now=new Date(), isCur=(y===now.getFullYear()&&m===now.getMonth());
  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="cal-cell blank"></div>';
  let monthWorkouts=0, monthVol=0;
  for(let d=1;d<=daysIn;d++){
    const ds=y+'-'+pad2(m+1)+'-'+pad2(d);
    const ss=sessionsOn(ds), cc=cardioOn(ds);
    const dots=ss.map(s=>'<i style="background:'+progOf(s.day).hex+'"></i>').join('')
      + cc.map(()=>'<i style="background:'+((CFG.programs.filter(p=>p.type==='cardio')[0]||{hex:'#3DA9FC'}).hex)+'"></i>').join('');
    const has=ss.length||cc.length;
    if(has){ monthWorkouts++; monthVol+=ss.reduce((a,s)=>a+volumeOf(s),0); }
    const bg = has ? 'background:color-mix(in srgb,'+(ss.length?progOf(ss[0].day).hex:'#3DA9FC')+' 22%, var(--surface-2));' : '';
    cells+='<div class="cal-cell'+(has?' has':'')+(ds===today?' today':'')+(state.calSel===ds?' sel':'')+'" '
      +(has?'data-act="calday" data-v="'+ds+'"':'')+' style="--i:'+d+';'+bg+'">'+d
      +(dots?'<span class="cal-dots">'+dots+'</span>':'')+'</div>';
  }
  const legend = CFG.programs.map(p=>'<span><i style="background:'+p.hex+'"></i>'+esc(p.short||p.label)+'</span>').join('');

  let detail='';
  if(state.calSel){
    const ss=sessionsOn(state.calSel), cc=cardioOn(state.calSel);
    const kindLbl = id => (CARDIO_KINDS.filter(k=>k.id===id)[0]||{label:id}).label;
    const lines = ss.map(s=>{
      const v=Math.round(volumeOf(s));
      return '<div>'+esc(progOf(s.day).label)+' — '+sessionPct(s)+'% · '+setsDone(s)+' סטים'+(v?' · '+num(v)+' ק״ג':'')+(s.note?' · '+esc(s.note):'')+'</div>';
    }).concat(cc.map(l=>'<div>'+esc(kindLbl(l.kind))+' — '+l.min+' דק׳'+(l.km?' · '+l.km+' ק"מ':'')+'</div>'));
    const dt=parseISO(state.calSel);
    detail='<div class="cal-detail"><div class="d">יום '+WEEKDAY_HE[dt.getDay()]+', '+dt.getDate()+' ב'+MONTH_HE[dt.getMonth()]+'</div>'+(lines.join('')||'לא נרשם אימון')+'</div>';
  }

  return '<div class="card"><div class="cal-nav">'
    +'<button data-act="mon" data-v="-1">‹ קודם</button>'
    +'<span class="cal-title">'+MONTH_HE[m]+' '+y+'</span>'
    +'<button data-act="mon" data-v="1" '+(isCur?'disabled':'')+'>הבא ›</button></div>'
    +'<div class="cal-grid">'+WEEKDAY_HE.map(w=>'<div class="cal-wd">'+w+'</div>').join('')+cells+'</div>'
    +'<div class="cal-sum">'
    +'<div class="stat" style="--sc:var(--pc)"><div class="n">'+monthWorkouts+'</div><div class="l">ימי אימון החודש</div></div>'
    +'<div class="stat" style="--sc:var(--green)"><div class="n">'+num(Math.round(monthVol))+'</div><div class="l">ק״ג הורמו החודש</div></div>'
    +'</div>'+detail
    +'<div class="cal-legend">'+legend+'</div>'
    +'<div class="log-note">כל ריבוע צבוע הוא יום שבו נרשם אימון. לחיצה על יום מראה מה נעשה בו.</div></div>';
}
