<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210" class="lifter" role="img" aria-label="lifting animation"><style>.lifter{display:block;margin:0 auto;overflow:visible;}.lifter .lf-body{fill:url(#lfBody);}.lifter .lf-limb{stroke:url(#lfBody);stroke-width:13;stroke-linecap:round;fill:none;}.lifter .lf-arm{stroke:#5EE7FF;stroke-width:12;stroke-linecap:round;fill:none;}.lifter .lf-bell{fill:#FF4D6D;}.lifter .lf-ring{fill:none;stroke:url(#lfRing);stroke-width:6;stroke-linecap:round;stroke-dasharray:290 250;opacity:.85;}.lifter .lf-ring,.lifter .lf-body,.lifter .lf-fore{transform-box:view-box;}.lifter .lf-ring{transform-origin:100px 105px;animation:lfSpin 2.8s linear infinite;}.lifter .lf-body{transform-origin:100px 190px;animation:lfBob .95s ease-in-out infinite;}.lifter .lf-foreL{transform-origin:58px 110px;animation:lfCurlL 1.9s cubic-bezier(.45,0,.35,1) infinite;}.lifter .lf-foreR{transform-origin:142px 110px;animation:lfCurlR 1.9s cubic-bezier(.45,0,.35,1) infinite;animation-delay:-.95s;}@keyframes lfSpin{to{transform:rotate(360deg);}}@keyframes lfBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2.5px);}}@keyframes lfCurlL{0%,100%{transform:rotate(0);}40%{transform:rotate(-155deg);}55%{transform:rotate(-148deg);}}@keyframes lfCurlR{0%,100%{transform:rotate(0);}40%{transform:rotate(155deg);}55%{transform:rotate(148deg);}}@media (prefers-reduced-motion: reduce){.lifter *{animation:none !important;}}</style><defs>
<linearGradient id="lfRing" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#5EE7FF"/><stop offset="50%" stop-color="#3DA9FC"/><stop offset="100%" stop-color="#FF4D6D"/>
</linearGradient>
<linearGradient id="lfBody" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#5EE7FF"/><stop offset="100%" stop-color="#2FE6A7"/>
</linearGradient>
</defs><circle class="lf-ring" cx="100" cy="105" r="86"/><g class="lf-body"><circle cx="100" cy="40" r="13"/><path d="M76 60 Q100 53 124 60 L117 120 Q100 126 83 120 Z"/><path class="lf-limb" d="M89 122 L84 190"/><path class="lf-limb" d="M111 122 L116 190"/></g><path class="lf-arm" d="M78 65 L58 110"/><path class="lf-arm" d="M122 65 L142 110"/><g class="lf-fore lf-foreL"><path class="lf-arm" d="M58 110 L58 148"/><g transform="translate(58 150)" class="lf-bell"><rect x="-15" y="-3.5" width="30" height="7" rx="3.5"/><rect x="-21" y="-9" width="8" height="18" rx="3"/><rect x="13" y="-9" width="8" height="18" rx="3"/></g></g><g class="lf-fore lf-foreR"><path class="lf-arm" d="M142 110 L142 148"/><g transform="translate(142 150)" class="lf-bell"><rect x="-15" y="-3.5" width="30" height="7" rx="3.5"/><rect x="-21" y="-9" width="8" height="18" rx="3"/><rect x="13" y="-9" width="8" height="18" rx="3"/></g></g></svg>